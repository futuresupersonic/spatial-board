<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>board</title>

<!--
  BOARD — v3
  1. ATOM       One card = one exchange. Question + answer, one number, born at commit.
  2. PLACEMENT  N+1 lands right of N. Occupied -> nearest free space. Never pushes.
  3. STEERING   "Right of N" is relative to where N is. Drag it and the conversation follows.
  4. CAMERA     Cards never move. Camera moves only if the card lands off-screen
                and you aren't mid-drag.
  5. COMPOSER   Bottom-center of the board. Always.
  6. IN-FLIGHT  Screen space, occludes. Question pins top, answer grows beneath,
                view follows the writing edge. Commits as one card; you watch it fly.
  7. NUMBERS    Flat integers. Immutable. Gappy. Quiet. Per board.
  8. LINEAR     A lens. Node positions are never overwritten.
  9. NO OVERLAP One rule for placement and for drops: nearest free space.
  10. SIDEBAR   Each Recent is a board — its own cards, numbers, and camera.
                Board names come from YOUR first question, never a summary.

  RESPOND() at the bottom is the seam.
-->

<style>
  :root {
    --bg: #111112;
    --card: #232326;
    --card-hi: #2a2a2e;
    --q-bg: #191a1f;
    --edge: #35353a;
    --ink: #e8e8ea;
    --ink-dim: #8a8a92;
    --ink-faint: #55555c;
    --chrome-bg: #1b1b1e;
    --side: #0d0d0e;
    --live: #0a0a0b;
    --r: 14px;
    --sw: 258px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; }

  /* ================= sidebar ================= */
  #side {
    position: fixed; left: 0; top: 0; bottom: 0; width: var(--sw);
    background: var(--side); border-right: 1px solid #202024;
    display: flex; flex-direction: column; z-index: 400;
    transition: width .22s cubic-bezier(.3,.7,.25,1);
    overflow: hidden;
  }
  body.rail #side { width: 58px; }

  #brand {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 12px 10px 14px; flex: none;
  }
  #mark {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    border: 1px solid #3a3a44;
    display: grid; place-items: center;
    background: #17171c;
  }
  #brandname {
    font-size: 14px; font-weight: 600; letter-spacing: -.01em;
    white-space: nowrap; flex: 1;
  }
  .railhide { transition: opacity .14s; }
  body.rail .railhide { opacity: 0; pointer-events: none; }

  .nav { padding: 4px 8px; flex: none; }
  .item {
    display: flex; align-items: center; gap: 11px;
    height: 38px; padding: 0 10px; border-radius: 9px;
    color: var(--ink-dim); cursor: pointer; user-select: none;
    font-size: 14px; white-space: nowrap;
  }
  .item:hover { background: #1a1a1f; color: var(--ink); }
  .item.on { background: #212127; color: var(--ink); }
  .item .ico { flex: none; width: 18px; height: 18px; display: grid; place-items: center; }
  .item .lbl { overflow: hidden; }

  #recents {
    flex: 1; overflow-y: auto; padding: 6px 8px 8px;
    border-top: 1px solid #1c1c20; margin-top: 6px; min-height: 0;
  }
  body.rail #recents { visibility: hidden; }
  .eyebrow {
    font-size: 11px; color: var(--ink-faint); letter-spacing: .06em;
    text-transform: uppercase; padding: 8px 10px 6px; white-space: nowrap;
  }
  .rec {
    display: flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 6px 0 10px; border-radius: 8px;
    color: var(--ink-dim); cursor: pointer; user-select: none;
    font-size: 13.5px;
  }
  .rec:hover { background: #1a1a1f; color: var(--ink); }
  .rec.on { background: #212127; color: var(--ink); }
  .rec .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec .pin {
    flex: none; width: 22px; height: 22px; border-radius: 5px;
    display: none; place-items: center; color: var(--ink-faint);
  }
  .rec:hover .pin { display: grid; }
  .rec .pin:hover { background: #2e2e36; color: var(--ink); }
  .rec.pinned .pin { display: grid; color: #8f88ff; }

  #who {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 12px 14px; border-top: 1px solid #1c1c20;
  }
  #avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #cfe97a, #8fbf3f);
  }
  #whoname { flex: 1; font-size: 13.5px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; }
  .iconbtn {
    width: 28px; height: 28px; border-radius: 7px; flex: none;
    display: grid; place-items: center; color: var(--ink-faint); cursor: pointer;
  }
  .iconbtn:hover { background: #212127; color: var(--ink); }

  /* ================= board ================= */
  #stage {
    position: fixed; top: 0; right: 0; bottom: 0; left: var(--sw);
    overflow: hidden; cursor: grab; touch-action: none;
    transition: left .22s cubic-bezier(.3,.7,.25,1);
  }
  body.rail #stage { left: 58px; }
  #stage.panning { cursor: grabbing; }
  #dots { position: absolute; inset: 0; pointer-events: none; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #thread { position: absolute; overflow: visible; pointer-events: none; left: 0; top: 0; }

  /* ---------- links between cards (node only) ---------- */
  #links { position: absolute; overflow: visible; pointer-events: none; left: 0; top: 0; }
  body.linear #links, body.linear .lh { display: none; }
  #links path { fill: none; stroke: #6f6f86; stroke-width: 1.6; }
  #links path.sel { stroke: #a9a3ff; stroke-width: 2.2; }
  #links .hit { stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
  #links .llabel {
    fill: var(--ink); font-size: 12.5px; paint-order: stroke;
    stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round;
    text-anchor: middle; dominant-baseline: middle; cursor: pointer; pointer-events: auto;
  }
  /* the four connect handles around a card */
  .lh {
    position: absolute; width: 15px; height: 15px; border-radius: 50%;
    background: var(--card); border: 1.6px solid #6f6f86;
    opacity: 0; transition: opacity .12s, transform .12s, background .12s;
    cursor: crosshair; z-index: 40;
  }
  .card:hover .lh { opacity: 1; }
  .lh:hover { background: #a9a3ff; border-color: #a9a3ff; transform: scale(1.25); }
  .lh.t { top: -8px;  left: 50%; margin-left: -7.5px; }
  .lh.b { bottom: -8px; left: 50%; margin-left: -7.5px; }
  .lh.l { left: -8px; top: 50%; margin-top: -7.5px; }
  .lh.r { right: -8px; top: 50%; margin-top: -7.5px; }
  .card.mini .lh { display: none; }
  /* label editor */
  #linkedit {
    position: fixed; z-index: 500; display: none;
    background: #1b1b20; border: 1px solid var(--edge); border-radius: 10px;
    padding: 8px; box-shadow: 0 18px 50px rgba(0,0,0,.6); width: 230px;
  }
  #linkedit.open { display: block; }
  #linkedit input {
    width: 100%; background: #111114; border: 1px solid var(--edge);
    border-radius: 7px; color: var(--ink); font: inherit; font-size: 13px;
    padding: 7px 9px; outline: none; box-sizing: border-box;
  }
  #linkedit .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  #linkedit .ctx { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-dim); cursor: pointer; }
  #linkedit .ctx input { width: auto; }
  #linkedit .del { background: none; border: 0; color: #e28c8c; font: inherit; font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  #linkedit .del:hover { background: #2a2024; }
  /* linear: links become a text reference under the exchange */
  .linkref {
    display: none; font-size: 12.5px; color: var(--ink-faint);
    margin: 2px 0 0; padding: 0 2px;
  }
  body.linear .card .linkref { display: block; }
  body.linear .card.mini .linkref { display: block; }

  /* ---------- card ---------- */
  .card {
    position: absolute; width: 560px;
    background: var(--card); border: 1px solid var(--edge);
    border-radius: var(--r); padding: 22px 16px 10px;
    cursor: grab; user-select: none;
    transition: box-shadow .15s, border-color .15s, background .15s;
  }
  .card:hover { background: var(--card-hi); }
  .card.grabbed { cursor: grabbing; box-shadow: 0 18px 50px rgba(0,0,0,.55); border-color: #4a4a52; z-index: 50; }
  .card.blocked { border-color: #6b4a52; box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px #6b4a52; }
  .card.is-last { border-color: #4d4a63; }

  /* resize: you own the size too, not just the position */
  .card .grip {
    position: absolute; right: 0; bottom: 0; width: 18px; height: 18px;
    cursor: nwse-resize; opacity: 0; transition: opacity .12s;
  }
  .card .grip::after {
    content: ''; position: absolute; right: 4px; bottom: 4px;
    width: 8px; height: 8px;
    border-right: 1.5px solid var(--ink-faint); border-bottom: 1.5px solid var(--ink-faint);
    border-bottom-right-radius: 3px;
  }
  .card:hover .grip { opacity: 1; }
  .card.mini .grip { display: none; }

  .card .n {
    position: absolute; top: 8px; right: 11px;
    font-size: 10px; color: var(--ink-faint); font-variant-numeric: tabular-nums;
  }
  .card .min {
    position: absolute; top: 6px; left: 8px;
    width: 20px; height: 20px; border-radius: 5px;
    display: grid; place-items: center;
    color: var(--ink-faint); cursor: pointer; font-size: 13px; line-height: 1;
  }
  .card .min:hover { background: #3a3a40; color: var(--ink); }

  .card .q {
    background: var(--q-bg); border: 1px solid #26262c; border-radius: 9px;
    padding: 8px 11px; font-size: 13.5px; color: var(--ink-dim);
    white-space: pre-wrap; word-break: break-word; margin-bottom: 11px;
    max-height: 84px; overflow: hidden;
  }
  .card .a {
    white-space: pre-wrap; word-break: break-word; padding: 0 4px;
    overflow: hidden;
  }
  .card.clipped .a {
    -webkit-mask-image: linear-gradient(#000 72%, transparent);
    mask-image: linear-gradient(#000 72%, transparent);
  }
  .card .more {
    display: none; margin: 8px 0 0 4px; font-size: 12px;
    color: var(--ink-dim); cursor: pointer; user-select: none;
  }
  .card.clipped .more { display: inline-block; }
  .card .more:hover { color: var(--ink); }

  .card.mini { padding: 0 34px 0 30px; height: 36px; display: flex; align-items: center; }
  .card.mini .q, .card.mini .a, .card.mini .more { display: none; }

  /* ---------- per-exchange actions ---------- */
  .acts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
  .card:hover .acts { opacity: 1; }
  .qacts { justify-content: flex-end; margin: 2px 0 0; }
  .aacts { justify-content: flex-start; margin: 2px 0 0; }
  .card.mini .acts { display: none; }
  .acts button {
    position: relative; background: none; border: 0; padding: 3px;
    border-radius: 6px; color: var(--ink-dim); cursor: pointer;
    display: flex; align-items: center; font: inherit;
  }
  .acts button:hover { background: #2b2b32; color: var(--ink); }
  .acts button::after {
    content: attr(data-t); position: absolute; top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%); background: #26262c; border: 1px solid var(--edge);
    color: var(--ink); font-size: 11px; padding: 3px 7px; border-radius: 5px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .1s;
    z-index: 5;
  }
  .acts button:hover::after { opacity: 1; }
  #amenu {
    position: fixed; z-index: 400; display: none; width: 186px;
    background: #1b1b20; border: 1px solid var(--edge); border-radius: 11px;
    padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.6);
  }
  #amenu.open { display: block; }
  #amenu .mi {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 7px;
    font-size: 13px; color: var(--ink-dim); cursor: pointer;
  }
  #amenu .mi:hover { background: #26262c; color: var(--ink); }
  .card .bar { display: none; }
  .card.mini .bar {
    display: block; font-size: 13px; color: var(--ink-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
  }
  .card .peek {
    display: none; position: absolute; left: 0; top: calc(100% + 6px); width: 100%;
    background: #16161a; border: 1px solid var(--edge); border-radius: 10px;
    padding: 12px 14px; font-size: 13px; color: var(--ink); white-space: pre-wrap;
    box-shadow: 0 16px 44px rgba(0,0,0,.6); z-index: 60; max-height: 280px; overflow: auto;
  }
  .card.mini:hover .peek { display: block; }
  .card .peek .pq { color: var(--ink-dim); margin-bottom: 8px; }

  /* ================= linear: a conversation, not cards ================= */
  body.linear .card:not(.probe) {
    background: none !important; border: 0; border-radius: 0;
    padding: 0 0 8px; box-shadow: none; cursor: default;
  }
  body.linear .card .min,
  body.linear .card .more,
  body.linear .card .peek,
  body.linear .card .grip,
  body.linear .card .bar { display: none !important; }
  body.linear .card .n {
    top: auto; bottom: 12px; right: auto; left: 0;
    opacity: 0; transition: opacity .12s;
  }
  body.linear .card:hover .n { opacity: 1; }
  body.linear .card .q {
    max-width: 66%; width: fit-content; margin: 0 0 14px auto;
    max-height: none !important; overflow: visible;
    background: #2f2f2f; border: 0; border-radius: 26px;
    padding: 14px 20px; font-size: 15.5px; line-height: 1.55; color: var(--ink);
  }
  body.linear .card .a {
    max-height: none !important; overflow: visible; padding: 0 2px;
    font-size: 15.5px; line-height: 1.75;
  }
  body.linear .card.clipped .a { -webkit-mask-image: none; mask-image: none; }
  /* minimize is a board affordance. a chat shows the whole exchange. */
  body.linear .card.mini {
    height: auto !important; display: block !important;
    padding: 0 0 8px !important;
  }
  body.linear .card.mini .q, body.linear .card.mini .a { display: block !important; }

  /* ---------- chrome inside the board ---------- */
  #bar {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 200; display: flex; gap: 4px;
    background: var(--chrome-bg); border: 1px solid var(--edge);
    border-radius: 999px; padding: 4px;
  }
  #bar button {
    background: none; border: 0; color: var(--ink-dim);
    font: inherit; font-size: 13px; padding: 5px 16px;
    border-radius: 999px; cursor: pointer;
  }
  #bar button.on { background: #34343b; color: var(--ink); }

  /* injection target — the card a follow-up will nest under */
  body.injecting .card.inject-target { border-color: #a9a3ff; box-shadow: 0 0 0 2px #a9a3ff55; }
  body.linear.injecting .card.inject-target { box-shadow: none; outline: 2px solid #a9a3ff55; outline-offset: 4px; }

  /* ---------- share + board menu ---------- */
  #share {
    position: absolute; top: 18px; right: 18px; z-index: 200;
    display: flex; gap: 6px; align-items: center;
  }
  #share button {
    background: var(--chrome-bg); border: 1px solid var(--edge);
    color: var(--ink-dim); font: inherit; font-size: 13px;
    padding: 6px 13px; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
  }
  #share button:hover { color: var(--ink); }
  #dots3 { padding: 6px 10px; letter-spacing: 1px; }
  #menu {
    position: absolute; top: 42px; right: 0; display: none; width: 194px;
    background: #1b1b20; border: 1px solid var(--edge); border-radius: 11px;
    padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.6);
  }
  #menu.open { display: block; }
  #menu .mi {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 7px;
    font-size: 13px; color: var(--ink-dim); cursor: pointer;
  }
  #menu .mi:hover { background: #26262c; color: var(--ink); }
  #menu .mi.danger:hover { color: #e28c8c; }
  #menu .sep { height: 1px; background: var(--edge); margin: 5px 8px; }

  /* ---------- linear: jump between questions ---------- */
  #rail {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    z-index: 150; display: none; flex-direction: column;
    align-items: flex-end; gap: 8px;
  }
  body.linear #rail { display: flex; }
  #rail .rl {
    width: 18px; height: 2px; border-radius: 1px; background: #3a3a42;
    cursor: pointer; transition: background .12s, width .12s;
  }
  #rail .rl:hover { background: #6f6f7c; width: 26px; }
  #rail .rl.on { background: var(--ink-dim); width: 26px; }

  #composer {
    position: absolute; z-index: 200;
    left: 50%; transform: translateX(-50%); bottom: 26px;
    width: min(768px, calc(100% - 48px)); height: 52px;
    background: var(--chrome-bg); border: 1px solid var(--edge);
    border-radius: 26px; display: flex; align-items: center; gap: 10px;
    padding: 0 7px 0 20px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #composer input {
    flex: 1; background: none; border: 0; outline: none;
    color: var(--ink); font: inherit; padding: 0;
  }
  #composer input::placeholder { color: var(--ink-faint); }
  #dictate {
    width: 34px; height: 34px; border-radius: 50%; flex: none; cursor: pointer;
    display: grid; place-items: center; color: var(--ink-dim);
    background: none; border: 1px solid var(--edge);
    transition: color .15s, border-color .15s, background .15s;
  }
  #dictate svg { width: 16px; height: 16px; }
  #dictate:hover { color: var(--ink); border-color: #55555f; }
  #dictate.rec { color: #fff; background: #d2483f; border-color: #d2483f; animation: breathe 1.4s ease-in-out infinite; }
  #dictate.busy { color: var(--ink-dim); border-color: var(--edge); animation: breathe 1s ease-in-out infinite; }

  /* voice status line, above the composer. not part of the canvas. */
  #vstatus {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 84px; z-index: 160; display: none;
    font-size: 12.5px; color: var(--ink-dim);
    background: #1b1b20cc; border: 1px solid var(--edge);
    padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    backdrop-filter: blur(6px);
  }
  #vstatus.show { display: block; }
  #vstatus.err { color: #e79a94; border-color: #5a3a3a; }
  #vstatus .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 7px; vertical-align: middle; background: var(--ink-dim);
  }
  #vstatus.listening .dot { background: #6fcf8e; animation: breathe 1.2s ease-in-out infinite; }
  #vstatus.thinking .dot  { background: #d9b45a; animation: breathe .9s ease-in-out infinite; }
  #vstatus.speaking .dot  { background: #a9a3ff; animation: breathe 1.1s ease-in-out infinite; }
  #vstatus.connecting .dot{ background: #7a7a86; animation: breathe .8s ease-in-out infinite; }

  /* orb state tints (Mode 2). base is the idle purple orb. */
  #orb.connecting { animation: breathe .8s ease-in-out infinite; }
  #orb.listening  { box-shadow: 0 0 0 3px #6fcf8e55; animation: breathe 1.2s ease-in-out infinite; }
  #orb.thinking   { box-shadow: 0 0 0 3px #d9b45a55; animation: breathe .9s ease-in-out infinite; }
  #orb.speaking   { box-shadow: 0 0 0 3px #a9a3ff88; animation: breathe 1.1s ease-in-out infinite; }
  #orb.err        { box-shadow: 0 0 0 3px #d2483f77; }
  #orb {
    width: 40px; height: 40px; border-radius: 50%; flex: none; cursor: pointer;
    display: grid; place-items: center; color: var(--ink);
    background: radial-gradient(circle at 34% 28%, #a9a3ff, #5b52e6 58%, #2e2a75);
    opacity: .9; transform: scale(1); transition: opacity .25s, transform .25s;
  }
  #orb:hover { opacity: 1; }
  #orb svg { width: 17px; height: 17px; pointer-events: none; }
  #orb.live { opacity: 1; transform: scale(1); animation: breathe 1.9s ease-in-out infinite; }
  #orb.live svg { display: none; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  #flight {
    position: absolute; z-index: 150; width: 768px;
    background: var(--live); border: 1px solid #3d3d46;
    border-radius: var(--r); padding: 14px;
    box-shadow: 0 26px 70px rgba(0,0,0,.75);
    display: none; transform-origin: 0 0; max-height: 62vh; overflow: hidden;
  }
  #flight.flying { transition: transform .4s cubic-bezier(.3,.7,.25,1), opacity .4s; }
  /* linear: part of the conversation, not floating over it */
  #flight.inline {
    width: 768px; background: none; border: 0; box-shadow: none; padding: 0;
    max-height: none; overflow: visible;
  }
  #flight.inline #fq {
    max-width: 66%; width: fit-content; margin: 0 0 14px auto;
    background: #2f2f2f; border: 0; border-radius: 26px;
    padding: 14px 20px; font-size: 15.5px; line-height: 1.55; color: var(--ink);
  }
  #flight.inline #fa {
    max-height: none; overflow: visible; padding: 0 2px;
    font-size: 15.5px; line-height: 1.75;
  }
  #fq {
    background: #16161c; border: 1px solid #26262c; border-radius: 9px;
    padding: 9px 12px; font-size: 13.5px; color: var(--ink-dim);
    white-space: pre-wrap; word-break: break-word; margin-bottom: 12px;
  }
  #fa {
    white-space: pre-wrap; word-break: break-word; padding: 0 4px;
    max-height: calc(62vh - 80px); overflow-y: auto; scrollbar-width: thin;
  }
  #fa::-webkit-scrollbar { width: 4px; }
  #fa::-webkit-scrollbar-thumb { background: #35353a; border-radius: 2px; }
  #fa::after {

<script>
(function () {
  'use strict';

  var GAP = 28, PAD = 5, EDGE_PAD = 70;
  var CARD_W = 768, MIN_W = 360, MAX_W = 768;      // you can resize between these
  var CARD_AH = 260, MIN_AH = 120, MAX_AH = 640;   // answer viewport height
  var LINEAR_W = 768, FLIGHT_W = 768;

  var UI = { mode: 'node', dragging: false, busy: false, thread: false };
  var boards = [];
  var B = null;                       // current board
  var SR = { left: 0, top: 0, w: 0, h: 0 };

  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var dots = document.getElementById('dots');
  var dctx = dots.getContext('2d');
  var composer = document.getElementById('composer');
  var input = document.getElementById('input');
  var orb = document.getElementById('orb');
  var flight = document.getElementById('flight');
  var fq = document.getElementById('fq');
  var fa = document.getElementById('fa');
  var threadEl = document.getElementById('threadline');
  var reclist = document.getElementById('reclist');
  var emptyEl = document.getElementById('empty');
  var reader = document.getElementById('reader');
  var scrim = document.getElementById('scrim');

  function syncRect() {
    var r = stage.getBoundingClientRect();
    SR.left = r.left; SR.top = r.top; SR.w = r.width; SR.h = r.height;
  }
  function ex(e) { return e.clientX - SR.left; }
  function ey(e) { return e.clientY - SR.top; }

  // ---------- persistence ----------
  // Everything lives in a JS array until now — refresh the tab, lose the
  // board. Autosave the whole in-memory state to localStorage (debounced)
  // and restore it on load. Not a real backend/account system, but it's
  // the difference between a demo and something a tester can actually live
  // in across sessions.
  var STORAGE_KEY = 'spatialBoard.v1';
  var saveTimer = null;
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 500); }
  function saveNow() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState())); }
    catch (e) { console.warn('board: autosave failed', e); }
  }
  function serializeState() {
    return {
      v: 1, bid: bid, uid: uid, seq: seq, linkUid: linkUid,
      activeBoardId: B ? B.id : null,
      boards: boards.map(function (b) {
        return {
          id: b.id, name: b.name, pinned: b.pinned,
          nextN: b.nextN, lastId: b.lastId, view: b.view, scroll: b.scroll,
          links: b.links,
          cards: b.cards.map(function (c) {
            return { id: c.id, q: c.q, a: c.a, x: c.x, y: c.y, w: c.w, ah: c.ah,
                     mini: c.mini, interrupted: c.interrupted, parent: c.parent,
                     sub: c.sub, t: c.t, n: c.n };
          })
        };
      })
    };
  }
  function loadState() {
    var raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    if (!raw) return null;
    try { var s = JSON.parse(raw); return (s && s.boards && s.boards.length) ? s : null; }
    catch (e) { return null; }
  }
  function exportBoardJSON() {
    var blob = new Blob([JSON.stringify(serializeState(), null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'board-export-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveNow(); });

  // ---------- boards ----------
  var bid = 0, uid = 0, seq = 0;
  function newBoard(name) {
    var b = {
      id: ++bid, name: name || 'Untitled', pinned: false,
      cards: [], links: [], nextN: 1, lastId: null,
      view: { x: SR.w / 2, y: SR.h / 2 - 60, z: 1 },   // node camera
      scroll: 0                                        // linear scroll — separate state
    };
    boards.unshift(b);
    scheduleSave();
    return b;
  }
  // collapse any empty, unpinned "new chat" placeholders down to one —
  // keeps boards (newest-first) clean after the reuse-current-chat fix,
  // and also cleans up anything that piled up before that fix existed.
  function dedupeEmptyBoards() {
    var seenEmpty = false;
    var kept = boards.filter(function (b) {
      if (b.pinned || b.cards.length > 0) return true;
      if (seenEmpty) return false;
      seenEmpty = true;
      return true;
    });
    if (kept.length !== boards.length) { boards = kept; scheduleSave(); }
  }
  function switchTo(b) {
    if (B === b) return;
    // tear down current DOM; the data stays on the board object
    if (B) B.cards.forEach(function (c) { if (c.el) { c.el.remove(); c.el = null; } });
    B = b;
    B.cards.forEach(function (c) { buildEl(c); measure(c); });
    renderRecents(); draw();
    input.focus();
  }
  function renderRecents() {
    var list = boards.slice().sort(function (a, b2) { return (b2.pinned ? 1 : 0) - (a.pinned ? 1 : 0); });
    reclist.innerHTML = '';
    list.forEach(function (b) {
      var el = document.createElement('div');
      el.className = 'rec' + (b === B ? ' on' : '') + (b.pinned ? ' pinned' : '');
      el.innerHTML = '<div class="nm"></div><div class="pin" title="Pin">' +
        '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M5 1.5h4l-.6 3.2 2.1 2.1H3.5l2.1-2.1z"/><path d="M7 6.8V12.5"/></svg></div>';
      el.querySelector('.nm').textContent = b.name;
      el.addEventListener('click', function () { switchTo(b); });
      el.querySelector('.pin').addEventListener('click', function (e) {
        e.stopPropagation(); b.pinned = !b.pinned; renderRecents(); scheduleSave();
      });
      reclist.appendChild(el);
    });
  }

  // ---------- geometry ----------
  function toScreen(x, y) { return { x: x * B.view.z + B.view.x, y: y * B.view.z + B.view.y }; }
  function toWorld(x, y) { return { x: (x - B.view.x) / B.view.z, y: (y - B.view.y) / B.view.z }; }
  function overlaps(a, b) {
    return !(a.x + a.w + PAD <= b.x || b.x + b.w + PAD <= a.x ||
             a.y + a.h + PAD <= b.y || b.y + b.h + PAD <= a.y);
  }
  function collides(box, ignoreId) {
    for (var i = 0; i < B.cards.length; i++) {
      var c = B.cards[i];
      if (ignoreId && c.id === ignoreId) continue;
      if (overlaps(box, { x: c.x, y: c.y, w: c.w, h: c.h })) return true;
    }
    return false;
  }
  // one rule: placement AND drops
  function nearestFree(ideal, w, h, ignoreId) {
    if (!collides({ x: ideal.x, y: ideal.y, w: w, h: h }, ignoreId)) return ideal;
    // prefer a flush edge with a nearby card, so stacks line up exactly
    var snap = snapToEdge(ideal, w, h, ignoreId);
    if (snap) return snap;
    var step = 6;
    for (var r = 1; r < 220; r++) {
      var n = Math.max(8, Math.round(r * 2.2));
      for (var i = 0; i < n; i++) {
        var a = (i / n) * Math.PI * 2;
        var p = { x: ideal.x + Math.cos(a) * r * step, y: ideal.y + Math.sin(a) * r * step };
        if (!collides({ x: p.x, y: p.y, w: w, h: h }, ignoreId)) return p;
      }
    }
    return ideal;
  }
  // If the drop point is near a card, offer the four flush positions around it
  // (right/left/below/above, edges aligned, PAD gap) and take the free one
  // closest to where the card was released. Falls through to the spiral if none.
  var SNAP_REACH = 90;
  function snapToEdge(ideal, w, h, ignoreId) {
    var reach = Math.max(w, h) * 0.6 + SNAP_REACH;
    // find the single nearest card to where you released
    var target = null, tD = Infinity;
    var icx = ideal.x + w / 2, icy = ideal.y + h / 2;
    for (var i = 0; i < B.cards.length; i++) {
      var nb = B.cards[i];
      if (ignoreId && nb.id === ignoreId) continue;
      var d = Math.hypot((nb.x + nb.w / 2) - icx, (nb.y + nb.h / 2) - icy);
      if (d < tD) { tD = d; target = nb; }
    }
    if (!target) return null;
    // its four flush positions; take the free one nearest the release point
    var cands = [
      { x: target.x + target.w + PAD, y: target.y },          // right, tops aligned
      { x: target.x - w - PAD,        y: target.y },          // left,  tops aligned
      { x: target.x,                  y: target.y + target.h + PAD }, // below, lefts aligned
      { x: target.x,                  y: target.y - h - PAD }         // above, lefts aligned
    ];
    var best = null, bestD = Infinity;
    for (var k = 0; k < cands.length; k++) {
      var p = cands[k];
      if (collides({ x: p.x, y: p.y, w: w, h: h }, ignoreId)) continue;
      var pd = Math.hypot(p.x - ideal.x, p.y - ideal.y);
      if (pd < bestD && pd <= reach) { bestD = pd; best = p; }
    }
    return best;
  }
  function place(w, h) {
    var last = byId(B.lastId);
    var ideal = last ? { x: last.x + last.w + GAP, y: last.y } : { x: -CARD_W / 2, y: -100 };
    return nearestFree(ideal, w, h, null);
  }
  function byId(id) {
    for (var i = 0; i < B.cards.length; i++) if (B.cards[i].id === id) return B.cards[i];
    return null;
  }

  // ---------- cards ----------
  function addCard(q, a, x, y, opts) {
    opts = opts || {};
    var c = { id: ++uid, q: q, a: a, x: x, y: y,
              w: CARD_W, ah: CARD_AH, h: 0, mini: false, el: null,
              interrupted: !!opts.interrupted,
              parent: opts.parent || null,   // id of the exchange this was injected under
              sub: 0,                         // sub-index under parent (1,2,3…); 0 = top-level
              t: ++seq };                     // internal creation order, always monotonic
    if (c.parent != null) {
      // child: number is parent-relative (5-1, 5-2…). does not consume a top number.
      var siblings = B.cards.filter(function (k) { return k.parent === c.parent; });
      c.sub = siblings.length + 1;
      c.n = null;                             // children have no flat number
    } else {
      c.n = B.nextN++;                        // top-level: flat integer, time order
    }
    B.cards.push(c);
    buildEl(c); measure(c);
    scheduleSave();
    return c;
  }
  // display label: "6" for top-level, "5-1" for a child, tracing the parent's number

  function ordered_() {

  function drawLinks(LIN) {

  // linear: each linked card names its partners and the bridge word
  function renderLinkRefs() {

      if (!mine.length) { ref.textContent = ''; return; }
      // group by bridge word so the label stays attached to the right numbers

      mine.forEach(function (l) {

    for (var i = B.cards.length - 1; i >= 0; i--) {
      var c = B.cards[i];
      if (w.x >= c.x && w.x <= c.x + c.w && w.y >= c.y && w.y <= c.y + c.h) return c;
    }
    return null;
  }

  // ---- label / context editor ----
  var linkedit = document.getElementById('linkedit');
  var linkword = document.getElementById('linkword');
  var linkctx = document.getElementById('linkctx');
  var editingLink = null;
  function openLinkEditById(lk) {
    var a = byId(lk.a);
    var p = a ? toScreen(a.x + a.w / 2, a.y + a.h / 2) : { x: SR.w / 2, y: SR.h / 2 };
    openLinkEditAt(lk, SR.left + p.x, SR.top + p.y);

  linkctx.addEventListener('change', function () { if (editingLink) editingLink.context = linkctx.checked; });
  document.getElementById('linkdel').addEventListener('click', function () {
    if (!editingLink) return;
    B.links = B.links.filter(function (l) { return l !== editingLink; });

  window.addEventListener('pointerdown', function (e) {

        !(e.target.closest && e.target.closest('#links'))) closeLinkEdit();

  function drawDots() {
    var w = dots.width = Math.max(1, Math.round(SR.w));
    var h = dots.height = Math.max(1, Math.round(SR.h));
    dctx.clearRect(0, 0, w, h);
    if (UI.mode === 'linear') return;      // a chat has no canvas behind it
    var sp = 48 * B.view.z;
    if (sp < 12) return;
    var ox = ((B.view.x % sp) + sp) % sp, oy = ((B.view.y % sp) + sp) % sp;
    dctx.fillStyle = '#2a2a2d';
    for (var x = ox - sp; x < w; x += sp) for (var y = oy - sp; y < h; y += sp) dctx.fillRect(x, y, 1.5, 1.5);
  }

  // ---------- camera ----------
  function fullyVisible(c) {
    var p = toScreen(c.x, c.y);
    return p.x >= EDGE_PAD && p.y >= EDGE_PAD &&
           p.x + c.w * B.view.z <= SR.w - EDGE_PAD &&
           p.y + c.h * B.view.z <= SR.h - 130;
  }
  function maybeFollow(c) {
    if (UI.dragging || fullyVisible(c)) return;
    var p = toScreen(c.x, c.y), dx = 0, dy = 0;
    var right = p.x + c.w * B.view.z, bottom = p.y + c.h * B.view.z;
    if (right > SR.w - EDGE_PAD) dx = (SR.w - EDGE_PAD) - right;
    if (p.x < EDGE_PAD) dx = EDGE_PAD - p.x;
    if (bottom > SR.h - 130) dy = (SR.h - 130) - bottom;
    if (p.y < EDGE_PAD) dy = EDGE_PAD - p.y;
    panBy(dx, dy);
  }
  function panBy(dx, dy) {
    var sx = B.view.x, sy = B.view.y, t0 = performance.now(), D = 380;
    (function step(t) {
      var k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3);
      B.view.x = sx + dx * e; B.view.y = sy + dy * e;
      draw();
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  // ---------- drag ----------
  var drag = null;
  function startDrag(e, c) {
    if (UI.mode === 'linear') return;
    e.stopPropagation();
    UI.dragging = true;
    c.el.classList.add('grabbed');
    var st = toScreen(c.x, c.y);
    drag = { c: c, dx: ex(e) - st.x, dy: ey(e) - st.y };
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', endDrag);
  }
  function onDragMove(e) {
    if (!drag) return;
    var w = toWorld(ex(e) - drag.dx, ey(e) - drag.dy);
    drag.c.x = w.x; drag.c.y = w.y;
    drag.c.el.classList.toggle('blocked',
      collides({ x: w.x, y: w.y, w: drag.c.w, h: drag.c.h }, drag.c.id));
    draw();
  }
  function endDrag() {
    if (drag) {
      var c = drag.c;
      c.el.classList.remove('grabbed', 'blocked');
      var p = nearestFree({ x: c.x, y: c.y }, c.w, c.h, c.id);
      if (p.x !== c.x || p.y !== c.y) settle(c, p.x, p.y);
    }
    drag = null; UI.dragging = false;
    scheduleSave();
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', endDrag);
  }
  function settle(c, tx, ty) {
    var sx = c.x, sy = c.y, t0 = performance.now(), D = 220;
    (function step(t) {
      var k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3);
      c.x = sx + (tx - sx) * e; c.y = sy + (ty - sy) * e;
      draw();
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  // ---------- pan / zoom ----------
  var pan = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.card') || e.target.closest('#composer') ||
        e.target.closest('#bar') || e.target.closest('#util') || e.target.closest('#flight') ||
        e.target.closest('#links') || e.target.closest('#linkedit')) return;
    pan = { x: e.clientX, y: e.clientY };
    stage.classList.add('panning'); UI.dragging = true;
    window.addEventListener('pointermove', onPan);
    window.addEventListener('pointerup', endPan);
  });
  function onPan(e) {
    if (!pan) return;
    if (UI.mode === 'linear') {
      B.scroll -= e.clientY - pan.y;       // vertical only. no sideways drift.
      clampScroll();
    } else {
      B.view.x += e.clientX - pan.x; B.view.y += e.clientY - pan.y;
    }
    pan = { x: e.clientX, y: e.clientY }; draw();
  }
  function endPan() {
    pan = null; UI.dragging = false; stage.classList.remove('panning');
    window.removeEventListener('pointermove', onPan);
    window.removeEventListener('pointerup', endPan);
  }

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (UI.mode === 'linear') {            // scrolls. doesn't zoom. it's a chat.
      B.scroll += e.deltaY;
      clampScroll(); draw();
      return;
    }
    var f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0022));
    var z = Math.min(2.5, Math.max(0.12, B.view.z * f)), k = z / B.view.z;
    var mx = ex(e), my = ey(e);
    B.view.x = mx - (mx - B.view.x) * k;
    B.view.y = my - (my - B.view.y) * k;
    B.view.z = z; draw();
  }, { passive: false });

  // ---------- the loop ----------
  // when set, the next committed exchange is injected as a child of this card
  // (a sub-thread: 5-1, 5-2…). cleared after one use or on cancel.
  var injectTarget = null;
  function setInject(c) {
    injectTarget = c;
    document.body.classList.toggle('injecting', !!c);
    if (c) {
      input.placeholder = 'follow-up under ' + label(c) + ' — Esc to cancel';
      input.focus();
    } else {
      input.placeholder = 'type, or hold the mic to dictate';
    }
    draw();
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && injectTarget) { setInject(null); return; }
    if (e.key !== 'Enter' || !input.value.trim() || UI.busy) return;
    var text = input.value.trim();
    input.value = '';
    ask(text);
  });

  function ask(q) {
    UI.busy = true;
    if (!live) orb.classList.add('live');
    flight.classList.remove('flying', 'done');
    flight.style.transform = 'none'; flight.style.opacity = '1'; flight.style.display = 'block';
    fq.textContent = q; fa.textContent = '';
    positionFlight();

    // board name comes from YOUR first question. never a summary.
    if (B.cards.length === 0) {
      B.name = q.length > 38 ? q.slice(0, 38).trim() + '…' : q;
      renderRecents();
    }

    RESPOND(q, function (sofar) {
      fa.textContent = sofar;
      fa.scrollTop = fa.scrollHeight;
      positionFlight();
    }, function (full) {
      flight.classList.add('done');
      land(q, full);
    });
  }

  function positionFlight() {
    if (UI.mode === 'linear') {
      // inline, at the bottom of the thread, pinned above the composer.
      // no occlusion, nothing floating — it's just the next message arriving.
      flight.classList.add('inline');
      var lh = flight.offsetHeight;
      B.scroll = maxScroll(lh + ROW_GAP);
      flight.style.left = Math.round(SR.w / 2 - CARD_W / 2) + 'px';
      flight.style.top = Math.round(TOP_PAD - B.scroll + contentHeight()) + 'px';
      draw();
      return;
    }
    flight.classList.remove('inline');
    var h = flight.offsetHeight;
    flight.style.left = Math.round((SR.w - FLIGHT_W) / 2) + 'px';
    flight.style.top = Math.max(16, composer.offsetTop - h - 16) + 'px';
  }

  function land(q, a) {
    var probe = sizeOf(q, a);
    var tgt = injectTarget;
    var c, p;
    if (tgt) {
      // child card: place directly under the parent (or its last child), linked
      var anchor = lastDescendantOrSelf(tgt);
      p = nearestFree({ x: anchor.x, y: anchor.y + anchor.h + PAD }, probe.w, probe.h, null);
      c = addCard(q, a, p.x, p.y, { parent: tgt.id });
      B.links.push({ id: ++linkUid, a: tgt.id, b: c.id, word: '', context: true, lineage: true });
      setInject(null);
    } else {
      p = place(probe.w, probe.h);
      c = addCard(q, a, p.x, p.y);
    }
    c.el.style.opacity = '0';
    B.lastId = c.id;
    draw();

    if (UI.mode === 'linear') {
      // nothing flies. it's already where it belongs.
      flight.style.display = 'none';
      c.el.style.opacity = '1';
      if (!live) orb.classList.remove('live');
      UI.busy = false;
      scrollToBottom();
      return;
    }

    var fl = parseFloat(flight.style.left), ft = parseFloat(flight.style.top);
    var to = toScreen(c.x, c.y);
    var k = (CARD_W / FLIGHT_W) * B.view.z;
    flight.classList.add('flying');
    flight.style.transform = 'translate(' + (to.x - fl) + 'px,' + (to.y - ft) + 'px) scale(' + k + ')';
    flight.style.opacity = '0';

    setTimeout(function () {
      flight.style.display = 'none';
      flight.classList.remove('flying');
      flight.style.transform = 'none';
      c.el.style.opacity = '1';
      if (!live) orb.classList.remove('live');
      UI.busy = false;
      maybeFollow(c);
    }, 400);
  }

  // ---------- sidebar wiring ----------
  document.getElementById('collapse').addEventListener('click', toggleRail);
  document.getElementById('mark').addEventListener('click', function () {
    if (document.body.classList.contains('rail')) toggleRail();
  });
  function toggleRail() {

  document.getElementById('nNew').addEventListener('click', function () {

  document.getElementById('dots3').addEventListener('click', function (e) {

  document.getElementById('shareBtn').addEventListener('click', function () { flash(this); });

  // ---------- board chrome ----------
  document.getElementById('mNode').addEventListener('click', function () {

    document.body.classList.remove('linear');
    document.getElementById('mLinear').classList.remove('on'); draw();
  });
  document.getElementById('mLinear').addEventListener('click', function () {
    UI.mode = 'linear'; this.classList.add('on');
    document.body.classList.add('linear');
    document.getElementById('mNode').classList.remove('on');
    draw(); scrollToBottom();      // you open a chat at the newest message
  });
  document.getElementById('tThread').addEventListener('click', function () {
    UI.thread = !UI.thread; this.classList.toggle('on', UI.thread); draw();
  });
  document.getElementById('tHome').addEventListener('click', function () {
    var c = byId(B.lastId); if (!c) return;
    var p = renderPos(c);
    B.view.x = SR.w / 2 - (p.x + c.w / 2) * B.view.z;
    B.view.y = SR.h / 2 - (p.y + c.h / 2) * B.view.z;
    draw();
  });
  window.addEventListener('resize', function () { syncRect(); draw(); });

  // ---------- THE SEAM ----------
  // ================= voice =================
  // Both modes talk to the local relay (relay.js) so the OpenAI key stays off
  // this page. If the relay isn't running, voice is disabled and typing still
  // works. The board doesn't know or care that input came from speech — Mode 1
  // fills the composer, Mode 2 drives the same ask()/land() path as typing.
  // When served from the relay (http://localhost:PORT) use same-origin calls.
  // When opened straight from file:// the origin is 'null', so fall back to the
  // known relay address.
  var RELAY = (location.origin && location.origin.indexOf('http') === 0) ? location.origin : 'http://localhost:8787';
  var REALTIME_URL = 'https://api.openai.com/v1/realtime?model=gpt-4o-realtime-preview';

  // status line above the composer. real messages, real errors.
  var vstatus = document.getElementById('vstatus');
  function setStatus(text, kind) {
    // kind: '', 'connecting', 'listening', 'thinking', 'speaking', 'err'
    vstatus.className = 'show' + (kind ? ' ' + kind : '');
    var withDot = kind && kind !== 'err' && kind !== '';
    vstatus.innerHTML = (withDot ? '<span class="dot"></span>' : '') + escapeHtml(text);
  }
  function clearStatus() { vstatus.className = ''; vstatus.textContent = ''; }
  function flashStatus(text, kind, ms) {
    setStatus(text, kind || '');
    setTimeout(function () { if (!live) clearStatus(); }, ms || 3200);
  }
  function escapeHtml(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  function pickMime() {
    var opts = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
    for (var i = 0; i < opts.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i])) return opts[i];
    return '';
  }

  // ======== Mode 1: dictation (ChatGPT-style) ========
  // tap to start, tap to stop, transcribe into composer, edit before send,
  // no model response until you press Enter. clear states throughout.
  var dictate = document.getElementById('dictate');
  var dictRec = null, dictChunks = [], dictStream = null;

  dictate.addEventListener('click', function () {
    if (dictRec && dictRec.state === 'recording') stopDictation();
    else startDictation();
  });

  async function startDictation() {
    if (dictRec) return;
    setStatus('Requesting microphone…', 'connecting');
    try {
      dictStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      dictStream = null;
      flashStatus('Microphone blocked: ' + (err && err.message ? err.message : err) + '. Allow mic access and retry.', 'err', 5000);
      return;
    }
    try {
      dictChunks = [];
      dictRec = new MediaRecorder(dictStream, pickMime() ? { mimeType: pickMime() } : undefined);
      dictRec.ondataavailable = function (e) { if (e.data && e.data.size) dictChunks.push(e.data); };
      dictRec.onerror = function (e) {
        flashStatus('Recording error: ' + (e.error && e.error.message ? e.error.message : 'unknown'), 'err', 5000);
        cleanupDict();
      };
      dictRec.onstop = onDictStop;
      dictRec.start();
      dictate.classList.add('rec');
      setStatus('Recording — tap the mic to stop', 'listening');
    } catch (err) {
      flashStatus('Could not start recording: ' + (err && err.message ? err.message : err), 'err', 5000);
      cleanupDict();
    }
  }

  function stopDictation() {
    if (dictRec && dictRec.state !== 'inactive') {
      dictate.classList.remove('rec');
      dictate.classList.add('busy');
      setStatus('Processing…', 'thinking');
      dictRec.stop();
    }
  }

  async function onDictStop() {
    var mime = (dictRec && dictRec.mimeType) || 'audio/webm';
    if (dictStream) { dictStream.getTracks().forEach(function (t) { t.stop(); }); dictStream = null; }
    var blob = new Blob(dictChunks, { type: mime });
    dictRec = null;
    if (!blob.size) { dictate.classList.remove('busy'); flashStatus('Nothing recorded — try again.', 'err', 3000); return; }
    try {
      var r = await fetch(RELAY + '/transcribe', { method: 'POST', headers: { 'Content-Type': mime }, body: blob });
      if (!r.ok) {
        var detail = await r.text().catch(function () { return ''; });
        throw new Error('HTTP ' + r.status + (detail ? ' — ' + detail.slice(0, 160) : ''));
      }
      var text = (await r.text()).trim();
      dictate.classList.remove('busy');
      if (text) {
        input.value = (input.value ? input.value.trim() + ' ' : '') + text;
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        flashStatus('Transcribed — edit, then press Enter to send', '', 2600);
      } else {
        flashStatus('No speech detected.', 'err', 2600);
      }
    } catch (err) {
      dictate.classList.remove('busy');
      var m = String(err && err.message ? err.message : err);
      var hint = /Failed to fetch|NetworkError/.test(m) ? ' — is relay.js running on ' + RELAY + '?' : '';
      flashStatus('Transcription failed: ' + m + hint, 'err', 6000);
    }
  }
  function cleanupDict() {
    dictate.classList.remove('rec', 'busy');
    if (dictStream) { dictStream.getTracks().forEach(function (t) { t.stop(); }); dictStream = null; }
    dictRec = null;
  }

  // ======== Mode 2: continuous live conversation (ChatGPT Voice-style) ========
  // tap the orb to connect. server-side VAD means you just talk — no tap per
  // turn. the AI speaks back. you can interrupt. each completed exchange lands
  // as one card. orb + status show connecting/listening/thinking/speaking/ended.
  var live = null;                 // { pc, dc, stream, audioEl } while open
  var liveQ = '', liveA = '';      // transcripts building for the current turn
  var orbState = '';

  function setOrb(state) {         // '', connecting, listening, thinking, speaking, err
    orbState = state;
    orb.className = state ? state : '';
    orb.classList.toggle('live', !!live);
  }

  orb.addEventListener('click', function () { if (live) stopLive('Ended.'); else startLive(); });

  async function startLive() {
    setOrb('connecting');
    setStatus('Connecting…', 'connecting');
    var stream, pc, token;
    // 1) ephemeral token from relay
    try {
      var sres = await fetch(RELAY + '/session', { method: 'POST' });
      if (!sres.ok) {
        var d = await sres.text().catch(function () { return ''; });
        throw new Error('session HTTP ' + sres.status + (d ? ' — ' + d.slice(0, 160) : ''));
      }
      var sess = await sres.json();
      token = sess && sess.client_secret && sess.client_secret.value;
      if (!token) throw new Error('relay returned no token (check OPENAI_API_KEY)');
    } catch (err) {
      failLive('Could not start session: ' + msg(err) + (isNet(err) ? ' — is relay.js running on ' + RELAY + '?' : ''));
      return;
    }
    // 2) mic
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      failLive('Microphone blocked: ' + msg(err) + '. Allow mic access and retry.');
      return;
    }
    // 3) webrtc to OpenAI
    try {
      pc = new RTCPeerConnection();
      var audioEl = document.createElement('audio');
      audioEl.autoplay = true;
      pc.ontrack = function (e) { audioEl.srcObject = e.streams[0]; };
      pc.onconnectionstatechange = function () {
        if (!live) return;
        if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')
          failLive('Connection ' + pc.connectionState + '.');
      };
      stream.getTracks().forEach(function (t) { pc.addTrack(t, stream); });

      var dc = pc.createDataChannel('oai-events');
      dc.onopen = function () { live = { pc: pc, dc: dc, stream: stream, audioEl: audioEl }; setOrb('listening'); setStatus('Listening — just speak', 'listening'); };
      dc.onmessage = onLiveEvent;

      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      var ans = await fetch(REALTIME_URL, {
        method: 'POST', body: offer.sdp,
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/sdp' }
      });
      if (!ans.ok) {
        var da = await ans.text().catch(function () { return ''; });
        throw new Error('realtime HTTP ' + ans.status + (da ? ' — ' + da.slice(0, 160) : ''));
      }
      var answer = await ans.text();
      await pc.setRemoteDescription({ type: 'answer', sdp: answer });
      liveQ = ''; liveA = '';
      // live is set on dc.onopen
      // safety: clean up the pieces if we never opened
      setTimeout(function () {
        if (!live) { try { stream.getTracks().forEach(function (t) { t.stop(); }); pc.close(); } catch (e) {} }
      }, 8000);
    } catch (err) {
      try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      try { pc && pc.close(); } catch (e) {}
      failLive('Voice connection failed: ' + msg(err));
    }
  }

  function stopLive(note) {
    if (!live) { setOrb(''); clearStatus(); return; }
    try { live.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { live.dc.close(); live.pc.close(); } catch (e) {}
    live = null; setOrb('');
    if (note) flashStatus(note, '', 1800); else clearStatus();
  }
  function failLive(text) {
    if (live) { try { live.stream.getTracks().forEach(function (t) { t.stop(); }); live.pc.close(); } catch (e) {} live = null; }
    setOrb('err');
    setStatus(text, 'err');
    setTimeout(function () { if (!live) { orb.className = ''; clearStatus(); } }, 6000);
  }

  function onLiveEvent(ev) {
    var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    switch (m.type) {
      case 'input_audio_buffer.speech_started':
        // you started talking. if the AI was speaking, that's an interruption:
        // cut its audio and commit whatever it managed to say.
        if (orbState === 'speaking') {
          try { live.audioEl.pause(); } catch (e) {}
          commitTurnIfAny(true);      // interrupted answers still land — verbatim
          if (live && live.dc.readyState === 'open')
            live.dc.send(JSON.stringify({ type: 'response.cancel' }));
        }
        setOrb('listening'); setStatus('Listening…', 'listening');
        break;
      case 'input_audio_buffer.speech_stopped':
        setOrb('thinking'); setStatus('Thinking…', 'thinking');
        break;
      case 'conversation.item.input_audio_transcription.completed':
        liveQ = (m.transcript || '').trim();
        break;
      case 'response.audio_transcript.delta':
        if (orbState !== 'speaking') { setOrb('speaking'); setStatus('Speaking…', 'speaking'); }
        liveA += m.delta || '';
        break;
      case 'response.done':
        commitTurnIfAny();
        if (live) { setOrb('listening'); setStatus('Listening — just speak', 'listening'); }
        break;
      case 'error':
        failLive('Realtime error: ' + (m.error && m.error.message ? m.error.message : 'unknown'));
        break;
    }
  }

  function commitTurnIfAny(interrupted) {
    var q = liveQ, a = liveA.trim();
    liveQ = ''; liveA = '';
    if (q || a) commitVoiceTurn(q, a, !!interrupted);
  }

  function msg(e) { return e && e.message ? e.message : String(e); }
  function isNet(e) { return /Failed to fetch|NetworkError/.test(msg(e)); }

  // the seam: a completed spoken exchange becomes a card, exactly like typing.
  function commitVoiceTurn(question, answer, interrupted) {
    if (B.cards.length === 0 && question) {
      B.name = question.length > 38 ? question.slice(0, 38).trim() + '…' : question;
      renderRecents();
    }
    // place directly — no #flight hijack, since voice has no in-flight card here
    var probe = sizeOf(question, answer);
    var p = place(probe.w, probe.h);
    var c = addCard(question, answer, p.x, p.y, { interrupted: !!interrupted });
    B.lastId = c.id;
    draw();
    if (UI.mode === 'linear') scrollToBottom();
    else maybeFollow(c);
  }

  // ================= model: real backend, streamed =================
  // POST /chat on the same origin (server.js) proxies to OpenAI so the API
  // key never reaches the browser. Board history (this board's prior cards,
  // in creation order) rides along so answers have real continuity.
  function boardHistory(excludeId) {
    return B.cards
      .filter(function (c) { return c.id !== excludeId && c.a; })
      .sort(function (a, b) { return a.t - b.t; })
      .slice(-40)
      .map(function (c) { return { q: c.q, a: c.a }; });
  }

  function RESPOND(q, onToken, onDone) {
    var sofar = '';
    var ctrl = new AbortController();
    fetch(RELAY + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, history: boardHistory(null) }),
      signal: ctrl.signal
    }).then(async function (r) {
      if (!r.ok || !r.body) {
        var detail = '';
        try { detail = (await r.json()).error; } catch (e) { try { detail = await r.text(); } catch (e2) {} }
        throw new Error(detail || ('HTTP ' + r.status));
      }
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        sofar += decoder.decode(chunk.value, { stream: true });
        onToken(sofar);
      }
      sofar += decoder.decode();
      onDone(sofar || '(empty response)');
    }).catch(function (err) {
      var m = err && err.message ? err.message : String(err);
      var hint = /Failed to fetch|NetworkError/.test(m) ? ' — is the server running (npm start) on ' + RELAY + '?' : '';
      onDone((sofar ? sofar + '\n\n' : '') + '[error: ' + m + hint + ']');
    });
  }

  // ---------- start ----------
  syncRect();
  (function boot() {
    var saved = loadState();
    if (saved) {
      bid = saved.bid || 0; uid = saved.uid || 0; seq = saved.seq || 0; linkUid = saved.linkUid || 0;
      boards = saved.boards.map(function (sb) {
        return {
          id: sb.id, name: sb.name, pinned: !!sb.pinned,
          cards: (sb.cards || []).map(function (sc) {
            return { id: sc.id, q: sc.q, a: sc.a, x: sc.x, y: sc.y,
                     w: sc.w || CARD_W, ah: sc.ah || CARD_AH, h: 0, mini: !!sc.mini,
                     el: null, interrupted: !!sc.interrupted,
                     parent: sc.parent != null ? sc.parent : null,
                     sub: sc.sub || 0, t: sc.t, n: sc.n };
          }),
          links: sb.links || [], nextN: sb.nextN || 1, lastId: sb.lastId || null,
          view: sb.view || { x: SR.w / 2, y: SR.h / 2 - 60, z: 1 },
          scroll: sb.scroll || 0
        };
      });
      dedupeEmptyBoards();   // clean up any empty "Untitled" chats stacked up before this fix
      var active = boards.filter(function (b) { return b.id === saved.activeBoardId; })[0] || boards[0];
      switchTo(active);
    } else {
      var seed = newBoard('Untitled');
      newBoard('Recruiter call preparation').pinned = true;
      newBoard('Placement rules, camera behaviour');
      newBoard('Does position mean anything');
      switchTo(seed);
    }
  })();
  draw();
  input.focus();
})();
</script>
