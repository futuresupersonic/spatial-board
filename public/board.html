      return;
    }
    var f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0022));
    var z = Math.min(2.5, Math.max(0.12, B.view.z * f)), k = z / B.view.z;
    var mx = ex(e), my = ey(e);
    B.view.x = mx - (mx - B.view.x) * k;
    B.view.y = my - (my - B.view.y) * k;
    B.view.z = z; draw();
  }, { passive: false });

  // ---------- the loop ----------
  // <<CTX-BEGIN>> ----------------------------------------------------------
  // CONTEXT PACKAGE. What the model is allowed to know when a question is asked.
  //
  // It is built ONLY from structure the user made on purpose:
  //   - the card being followed up from, and its follow-up lineage (5 → 5-1 → …)
  //   - links the user marked "use as context", with the bridge word they wrote
  //   - a quoted passage
  // Chronological history is a fallback, used only when the question is not
  // anchored to a card. Position (x, y) is never read: where a card sits on the
  // canvas cannot change what the model sees (rule 10).
  var CTX = {
    RECENT_UNANCHORED: 3,   // fallback history, only when nothing is anchored
    LINEAGE_MAX: 6,         // nearest ancestors kept (the parent is always kept)
    PRIOR_MAX: 6,           // earlier follow-ups under the same parent
    LINK_DEPTH: 2,          // hops across context links, starting at the parent
    LINK_MAX: 6,            // linked cards included in total
    Q_CHARS: 600, A_CHARS: 1800, QUOTE_CHARS: 1500,
    BUDGET_CHARS: 14000     // total card text sent; lowest-priority material drops first
  };
  function ctxClip(s, n) {
    s = String(s == null ? '' : s);
    return s.length > n ? s.slice(0, n).replace(/\s+$/, '') + ' …[truncated]' : s;
  }

  function buildContextPackage(question, activeCard, quote) {
    var cards = B.cards, links = B.links || [];
    var idx = {};
    cards.forEach(function (c) { idx[c.id] = c; });
    var anchor = (activeCard && idx[activeCard.id]) ? activeCard : null;
    var reg = {};                    // label -> card, for cards that made it into the package
    var included = {};               // card id -> true (de-duplication while walking)
    var linkEdges = [];              // context links walked, kept for the topology
    var dbg = { excluded: [], notes: [] };   // debug only: never sent to the model
    var pkg = {
      v: 1,
      current: { question: String(question), followUpFrom: null, quote: null },
      focus: { kind: 'none' },
      lineage: [], priorFollowUps: [], links: [], recent: [],
      structure: { nodes: [], edges: [] },
      meta: { anchored: !!anchor, boardCards: cards.length, includedCards: 0,
              usedChars: 0, budgetChars: CTX.BUDGET_CHARS, dropped: {} }
    };
    function drop(k, n) { pkg.meta.dropped[k] = (pkg.meta.dropped[k] || 0) + (n || 1); }
    function snap(c, role) {
      var o = { label: label(c), role: role, q: ctxClip(c.q, CTX.Q_CHARS), a: ctxClip(c.a, CTX.A_CHARS) };
      if (c.interrupted) o.interrupted = true;
      if (c.detached) o.detached = true;
      reg[o.label] = c; included[c.id] = true;
      return o;
    }

    if (anchor) {
      pkg.current.followUpFrom = label(anchor);

      // lineage: ancestors oldest → nearest, then the parent (the card followed up from)
      var chain = [], seen = {}, p = anchor;
      seen[p.id] = true;
      while (p.parent != null && idx[p.parent] && !seen[p.parent]) {
        p = idx[p.parent]; seen[p.id] = true; chain.unshift(p);
      }
      if (chain.length > CTX.LINEAGE_MAX) {
        drop('ancestors', chain.length - CTX.LINEAGE_MAX);
        chain = chain.slice(chain.length - CTX.LINEAGE_MAX);
      }
      chain.forEach(function (c) { pkg.lineage.push(snap(c, 'ancestor')); });
      pkg.lineage.push(snap(anchor, 'parent'));

      // earlier follow-ups under the same parent, in the order they were asked
      var kids = cards.filter(function (k) { return k.parent === anchor.id; })
                      .sort(function (a, b) { return a.sub - b.sub; });
      if (kids.length > CTX.PRIOR_MAX) {
        drop('priorFollowUps', kids.length - CTX.PRIOR_MAX);
        kids = kids.slice(kids.length - CTX.PRIOR_MAX);
      }
      kids.forEach(function (k) { pkg.priorFollowUps.push(snap(k, 'prior-followup')); });

      // explicit context links, breadth-first from the parent. loops are cut by
      // `included`; we only expand through cards newly added here, never through
      // cards already present as lineage.
      var adj = {};
      links.forEach(function (l) {
        if (l.lineage || !idx[l.a] || !idx[l.b]) return;   // follow-up links are lineage, handled above
        (adj[l.a] = adj[l.a] || []).push(l);
        (adj[l.b] = adj[l.b] || []).push(l);
      });
      var seenLink = {}, queue = [{ c: anchor, d: 0 }], linked = 0;
      while (queue.length) {
        var cur = queue.shift();
        (adj[cur.c.id] || []).forEach(function (l) {
          if (seenLink[l.id]) return;
          var other = idx[l.a === cur.c.id ? l.b : l.a];
          seenLink[l.id] = true;
          if (!l.context) {
            dbg.excluded.push({ card: label(other), from: label(cur.c), word: l.word || '',
                                reason: 'link has "use as context" OFF' });
            return;
          }
          if (cur.d >= CTX.LINK_DEPTH) {
            dbg.excluded.push({ card: label(other), from: label(cur.c), word: l.word || '',
                                reason: 'beyond link depth ' + CTX.LINK_DEPTH });
            return;
          }
          linkEdges.push({ from: label(cur.c), to: label(other), word: l.word || '' });
          if (included[other.id]) return;                  // already present: keep the edge only
          if (linked >= CTX.LINK_MAX) {
            drop('links'); dbg.notes.push('linked card ' + label(other) + ' skipped: LINK_MAX ' + CTX.LINK_MAX);
            return;
          }
          linked++;
          var s = snap(other, 'linked');
          s.hop = cur.d + 1;
          s.via = { from: label(cur.c), to: label(other), word: l.word || '' };
          pkg.links.push(s);
          queue.push({ c: other, d: cur.d + 1 });
        });
      }
    } else {
      // nothing anchored: fallback chronological history (creation order), oldest first
      cards.slice()
        .sort(function (a, b) { return (b.t || b.id) - (a.t || a.id); })
        .slice(0, CTX.RECENT_UNANCHORED).reverse()
        .forEach(function (c) { pkg.recent.push(snap(c, 'recent')); });
    }

    // focus: a quote outranks the card it came from
    if (quote && quote.text) {
      var qc = idx[quote.cardId];
      pkg.current.quote = { text: ctxClip(quote.text, CTX.QUOTE_CHARS), fromCard: qc ? label(qc) : null };
      pkg.focus = { kind: 'quote', quotedFrom: qc ? label(qc) : null };
    } else if (anchor) {
      pkg.focus = { kind: 'card', card: label(anchor) };
    }

    // budget: drop the lowest-priority material first. The question, the quote
    // and the parent are never dropped.
    function used() {
      var n = pkg.current.question.length + (pkg.current.quote ? pkg.current.quote.text.length : 0);
      [pkg.lineage, pkg.priorFollowUps, pkg.links, pkg.recent].forEach(function (a) {
        a.forEach(function (c) { n += c.q.length + c.a.length; });
      });
      return n;
    }
    while (used() > CTX.BUDGET_CHARS) {
      if (pkg.recent.length) { pkg.recent.shift(); drop('recent'); continue; }
      var deep = -1;
      pkg.links.forEach(function (c, i) { if (c.hop > 1) deep = i; });
      if (deep >= 0) { pkg.links.splice(deep, 1); drop('links'); continue; }
      if (pkg.links.length) { pkg.links.pop(); drop('links'); continue; }
      if (pkg.priorFollowUps.length) { pkg.priorFollowUps.shift(); drop('priorFollowUps'); continue; }
      if (pkg.lineage.length > 1) { pkg.lineage.shift(); drop('ancestors'); continue; }
      break;
    }

    // topology: only what survived, so the model can see why each piece is here
    var have = {}, nodes = [];
    [pkg.lineage, pkg.priorFollowUps, pkg.links, pkg.recent].forEach(function (a) {
      a.forEach(function (c) {
        if (!have[c.label]) { have[c.label] = true; nodes.push({ label: c.label, role: c.role }); }
      });
    });
    var edges = [];
    nodes.forEach(function (n) {
      var c = reg[n.label], pc = c && c.parent != null ? idx[c.parent] : null;
      if (pc && have[label(pc)]) edges.push({ type: 'followup', from: label(pc), to: n.label });
    });
    linkEdges.forEach(function (e) {
      if (have[e.from] && have[e.to]) edges.push({ type: 'link', from: e.from, to: e.to, word: e.word, context: true });
    });
    if (anchor) {
      nodes.push({ label: 'this question', role: 'current' });
      edges.push({ type: 'followup', from: label(anchor), to: 'this question' });
    }
    pkg.structure = { nodes: nodes, edges: edges };
    pkg.meta.includedCards = Object.keys(have).length;
    pkg.meta.usedChars = used();
    dbg.notIncluded = cards.length - pkg.meta.includedCards;
    pkg.debug = dbg;
    return pkg;
  }
  // what actually goes over the wire: the package without the debug-only block
  function ctxStrip(pkg) {
    var o = JSON.parse(JSON.stringify(pkg));
    delete o.debug;
    return o;
  }
  // <<CTX-END>> ------------------------------------------------------------

  // ---- context log + temporary debug panel ----
  var CTX_LOG = [], ctxN = 0, ctxSel = null;
  var ctxPanel = document.getElementById('ctxpanel'), ctxBtn = document.getElementById('ctxbtn');
  function ctxRecord(question, pkg) {
    var e = { n: ++ctxN, question: question, pkg: pkg, answeredBy: 'pending', error: null, rendered: null };
    CTX_LOG.unshift(e);
    if (CTX_LOG.length > 40) CTX_LOG.pop();
    ctxSel = e;
    try {
      console.groupCollapsed('[context] #' + e.n + ' ' +
        (pkg.meta.anchored ? 'follow-up from ' + pkg.current.followUpFrom : 'plain question') +
        (pkg.current.quote ? ' + quote' : '') + ' — ' + question.slice(0, 60));
      console.log('sent to the model:', ctxStrip(pkg));
      console.log('debug only (not sent):', pkg.debug);
      console.groupEnd();
    } catch (err) {}
    ctxRefresh();
    return e;
  }
  function ctxRefresh() { if (ctxPanel.classList.contains('open')) renderCtxPanel(); }
  function toggleCtx(force) {
    var open = force == null ? !ctxPanel.classList.contains('open') : force;
    ctxPanel.classList.toggle('open', open);
    ctxBtn.classList.toggle('on', open);
    if (open) renderCtxPanel();
  }
  ctxBtn.addEventListener('click', function () { toggleCtx(); });
  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); toggleCtx(); }
  });

  function ctxRows(list, fmt) {
    if (!list.length) return '<div class="row">none</div>';
    return list.map(function (c) { return '<div class="row">' + fmt(c) + '</div>'; }).join('');
  }
  function ctxQ(s) { return '“' + escapeHtml(String(s).replace(/\s+/g, ' ').slice(0, 70)) + '”'; }
  function ctxDetail(e) {
    var p = e.pkg, m = p.meta, h = '';
    h += '<h4>Summary</h4><div class="row">' +
         (m.anchored ? '<b>Anchored</b> — follow-up from card <b>' + escapeHtml(p.current.followUpFrom) + '</b>'
                     : '<b>Plain question</b> — not anchored to a card') +
         (p.current.quote ? ' · quote from <b>' + escapeHtml(p.current.quote.fromCard || '?') + '</b>' : '') + '</div>' +
         '<div class="row">' + m.includedCards + ' of ' + m.boardCards + ' cards included · ' + m.usedChars +
         ' / ' + m.budgetChars + ' chars · answered by <b>' + escapeHtml(e.answeredBy) + '</b>' +
         (Object.keys(m.dropped).length ? ' · dropped ' + escapeHtml(JSON.stringify(m.dropped)) : '') + '</div>';
    if (e.error) h += '<div class="row nots">model error: ' + escapeHtml(e.error) + '</div>';
    h += '<h4>Current turn</h4><div class="row"><b>Question</b> ' + ctxQ(p.current.question) + '</div>';
    if (p.current.quote) h += '<div class="row"><b>Quote (highest priority)</b> ' + ctxQ(p.current.quote.text) + '</div>';
    h += '<h4>Lineage (oldest → parent)</h4>' +
         ctxRows(p.lineage, function (c) { return '<b>' + escapeHtml(c.label) + '</b> ' + escapeHtml(c.role) + ' — ' + ctxQ(c.q); });
    h += '<h4>Earlier follow-ups under the parent</h4>' +
         ctxRows(p.priorFollowUps, function (c) { return '<b>' + escapeHtml(c.label) + '</b> — ' + ctxQ(c.q); });
    h += '<h4>Explicit linked context</h4>' +
         ctxRows(p.links, function (c) {
           var v = c.via || {};
           return '<b>' + escapeHtml(c.label) + '</b> via ' + escapeHtml(v.from) + ' · relation ' +
                  (v.word ? '“' + escapeHtml(v.word) + '”' : '<i>(no label)</i>') + ' · hop ' + c.hop + ' — ' + ctxQ(c.q);
         });
    h += '<h4>Recent history (fallback)</h4>' +
         ctxRows(p.recent, function (c) { return '<b>' + escapeHtml(c.label) + '</b> — ' + ctxQ(c.q); });
    h += '<h4>Board structure sent</h4>' +
         ctxRows(p.structure.edges, function (x) {
           return escapeHtml(x.from) + (x.type === 'link' ? ' ↔ ' : ' → ') + escapeHtml(x.to) + ' · ' +
                  (x.type === 'link' ? 'link' + (x.word ? ' “' + escapeHtml(x.word) + '”' : ' (no label)') : 'follow-up');
         });
    var d = p.debug || { excluded: [], notes: [] };
    h += '<h4>Left out on purpose (debug only, not sent)</h4>' +
         ctxRows(d.excluded, function (x) {
           return '<span class="nots"><b>' + escapeHtml(x.card) + '</b> linked from ' + escapeHtml(x.from) +
                  (x.word ? ' “' + escapeHtml(x.word) + '”' : '') + ' — ' + escapeHtml(x.reason) + '</span>';
         }) +
         '<div class="row">' + d.notIncluded + ' other card' + (d.notIncluded === 1 ? '' : 's') + ' on the board not included</div>' +
         d.notes.map(function (n) { return '<div class="row nots">' + escapeHtml(n) + '</div>'; }).join('');
    h += '<h4>Package JSON (exactly what /chat received)</h4><pre>' + escapeHtml(JSON.stringify(ctxStrip(p), null, 2)) + '</pre>' +
         '<div class="btns"><button data-act="copy">Copy JSON</button><button data-act="render">' +
         (e.rendered ? 'Refresh' : 'Show') + ' rendered prompt</button></div>';
    if (e.rendered) h += '<h4>Rendered prompt (from the relay)</h4><pre>' + escapeHtml(e.rendered) + '</pre>';
    return h;
  }
  function renderCtxPanel() {
    var h = '<div class="ch"><span>Context sent to the model</span><button data-act="close" title="Close">×</button></div><div class="cl">';
    if (!CTX_LOG.length) h += '<div class="ci"><span class="cq">Nothing asked yet.</span></div>';
    CTX_LOG.forEach(function (e) {
      h += '<div class="ci' + (e === ctxSel ? ' sel' : '') + '" data-n="' + e.n + '"><span>#' + e.n + '</span>' +
           '<span class="cq">' + escapeHtml(e.question) + '</span>' +
           '<span class="tag">' + (e.pkg.meta.anchored ? 'from ' + escapeHtml(e.pkg.current.followUpFrom) : 'plain') + '</span>' +
           '<span class="tag">' + escapeHtml(e.answeredBy) + '</span></div>';
    });
    h += '</div><div class="cd">' + (ctxSel ? ctxDetail(ctxSel) : '') + '</div>';
    var keep = ctxPanel.querySelector('.cd'), top = keep ? keep.scrollTop : 0;
    ctxPanel.innerHTML = h;
    var cd = ctxPanel.querySelector('.cd'); if (cd) cd.scrollTop = top;
  }
  ctxPanel.addEventListener('click', function (ev) {
    var t = ev.target, row = t.closest && t.closest('.ci'), act = t.getAttribute && t.getAttribute('data-act');
    if (row) {
      var n = +row.getAttribute('data-n');
      ctxSel = CTX_LOG.filter(function (x) { return x.n === n; })[0] || ctxSel;
      renderCtxPanel();
    } else if (act === 'close') toggleCtx(false);
    else if (act === 'copy' && ctxSel) copyText(JSON.stringify(ctxStrip(ctxSel.pkg), null, 2), null);
    else if (act === 'render' && ctxSel) fetchRendered(ctxSel);
  });
  // ask the relay for the exact prompt it builds from this package (no model call)
  function fetchRendered(e) {
    e.rendered = 'loading…'; ctxRefresh();
    fetch(RELAY + '/context/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ package: ctxStrip(e.pkg) })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    }).then(function (j) {
      e.rendered = j.messages.map(function (m) { return '[' + m.role + ']\n' + m.content; }).join('\n\n');
      ctxRefresh();
    }).catch(function (err) {
      e.rendered = 'Could not render: ' + msg(err) + (isNet(err) ? ' — is relay.js running on ' + RELAY + '?' : '');
      ctxRefresh();
    });
  }

  // ---- follow-up target + quote ----
  // when set, the next committed exchange is injected as a child of this card
  // (a sub-thread: 5-1, 5-2…). cleared after one use or on cancel. a pending
  // quote always belongs to the same card as the target.
  var injectTarget = null, pendingQuote = null;
  function setInject(c) {
    if (pendingQuote && (!c || c.id !== pendingQuote.cardId)) pendingQuote = null;
    injectTarget = c;
    document.body.classList.toggle('injecting', !!c);
    if (c) {
      input.placeholder = (pendingQuote ? 'about the quoted passage in ' : 'follow-up under ') + label(c) + ' — Esc to cancel';
      input.focus();
    } else {
      input.placeholder = 'type, or hold the mic to dictate';
    }
    renderQuoteChip();
    draw();
  }
  var askq = document.getElementById('askq'), qchip = document.getElementById('qchip'), askqInfo = null;
  function renderQuoteChip() {
    if (!pendingQuote) { qchip.classList.remove('show'); return; }
    var c = byId(pendingQuote.cardId);
    qchip.querySelector('.qf').textContent = 'quoting ' + (c ? label(c) : '?');
    qchip.querySelector('.qt').textContent = '“' + pendingQuote.text.replace(/\s+/g, ' ') + '”';
    qchip.classList.add('show');
  }
  document.getElementById('qchipx').addEventListener('click', function () { setInject(null); });
  function setQuote(c, text) {
    pendingQuote = { text: text, cardId: c.id };
    closeReader();
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    setInject(c);                       // the quote makes this a follow-up under its card
  }
  // a selection inside one card's question/answer (linear view, or the reader)
  function selectionInfo() {
    var s = window.getSelection();
    if (!s || s.isCollapsed || !s.rangeCount) return null;
    var text = s.toString().trim();
    if (!text) return null;
    var node = s.anchorNode, el = node && (node.nodeType === 1 ? node : node.parentElement);
    var box = el && el.closest ? el.closest('.q, .a, .rq, .ra') : null;
    if (!box) return null;
    var card = null;
    if (box.closest('#reader')) card = readerCard;
    else {
      var ce = box.closest('.card');
      card = ce ? B.cards.filter(function (c) { return c.el === ce; })[0] : null;
    }
    if (!card) return null;
    var fn = s.focusNode, fel = fn && (fn.nodeType === 1 ? fn : fn.parentElement);
    if (!fel || !box.contains(fel)) return null;      // must stay inside one block
    return { text: text, card: card, rect: s.getRangeAt(0).getBoundingClientRect() };
  }
  function showAskq() {
    var info = selectionInfo();
    if (!info) { hideAskq(); return; }
    askqInfo = info;
    var r = info.rect;
    askq.style.left = Math.max(8, Math.min(window.innerWidth - 140, r.left + r.width / 2 - 60)) + 'px';
    askq.style.top = Math.max(8, r.top - 40) + 'px';
    askq.style.display = 'block';
  }
  function hideAskq() { askq.style.display = 'none'; askqInfo = null; }
  document.addEventListener('mouseup', function () { setTimeout(showAskq, 0); });
  document.addEventListener('keyup', function (e) { if (e.shiftKey) setTimeout(showAskq, 0); });
  document.addEventListener('selectionchange', function () {
    var s = window.getSelection();
    if (!s || s.isCollapsed) hideAskq();
  });
  askq.addEventListener('mousedown', function (e) { e.preventDefault(); });   // keep the selection alive
  askq.addEventListener('click', function () {
    if (!askqInfo) return;
    var info = askqInfo;
    hideAskq();
    setQuote(info.card, info.text);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && injectTarget) { setInject(null); return; }
    if (e.key !== 'Enter' || !input.value.trim() || UI.busy) return;
    var text = input.value.trim();
    input.value = '';
    ask(text);
  });

  function ask(q) {
    // snapshot what this question is asked FROM. the package is built now, so
    // nothing armed or cleared while the answer streams can change it.
    var tgt = injectTarget, quote = pendingQuote;
    var entry = ctxRecord(q, buildContextPackage(q, tgt, quote));

    UI.busy = true;
    if (!live) orb.classList.add('live');
    flight.classList.remove('flying', 'done');
    flight.style.transform = 'none'; flight.style.opacity = '1'; flight.style.display = 'block';
    fq.textContent = q; fa.textContent = '';
    positionFlight();

    // board name comes from YOUR first question. never a summary.
    if (B.cards.length === 0) {
      B.name = q.length > 38 ? q.slice(0, 38).trim() + '…' : q;
      renderRecents();
    }

    RESPOND(q, function (sofar) {
      fa.textContent = sofar;
      fa.scrollTop = fa.scrollHeight;
      positionFlight();
    }, function (full) {
      flight.classList.add('done');
      land(q, full, tgt, quote);
    }, entry);
  }

  function positionFlight() {
    if (UI.mode === 'linear') {
      // inline, at the bottom of the thread, pinned above the composer.
      // no occlusion, nothing floating — it's just the next message arriving.
      flight.classList.add('inline');
      var lh = flight.offsetHeight;
      B.scroll = maxScroll(lh + ROW_GAP);
      flight.style.left = Math.round(SR.w / 2 - CARD_W / 2) + 'px';
      flight.style.top = Math.round(TOP_PAD - B.scroll + contentHeight()) + 'px';
      draw();
      return;
    }
    flight.classList.remove('inline');
    var h = flight.offsetHeight;
    flight.style.left = Math.round((SR.w - FLIGHT_W) / 2) + 'px';
    flight.style.top = Math.max(16, composer.offsetTop - h - 16) + 'px';
  }

  function land(q, a, tgt, quote) {
    var probe = sizeOf(q, a);
    var c, p;
    if (tgt && B.cards.indexOf(tgt) === -1) tgt = null;   // target is no longer on this board
    if (tgt) {
      // child card: place directly under the parent (or its last child), linked
      var anchor = lastDescendantOrSelf(tgt);
      p = nearestFree({ x: anchor.x, y: anchor.y + anchor.h + PAD }, probe.w, probe.h, null);
      c = addCard(q, a, p.x, p.y, { parent: tgt.id, quote: quote });
      B.links.push({ id: ++linkUid, a: tgt.id, b: c.id, word: '', context: true, lineage: true });
      if (injectTarget === tgt) setInject(null);   // only clear if it's still the one we used
    } else {
      p = place(probe.w, probe.h);
      c = addCard(q, a, p.x, p.y);
    }
    c.el.style.opacity = '0';
    B.lastId = c.id;
    draw();

    if (UI.mode === 'linear') {
      // nothing flies. it's already where it belongs.
      flight.style.display = 'none';
      c.el.style.opacity = '1';
      if (!live) orb.classList.remove('live');
      UI.busy = false;
      scrollToBottom();
      return;
    }

    var fl = parseFloat(flight.style.left), ft = parseFloat(flight.style.top);
    var to = toScreen(c.x, c.y);
    var k = (CARD_W / FLIGHT_W) * B.view.z;
    flight.classList.add('flying');
    flight.style.transform = 'translate(' + (to.x - fl) + 'px,' + (to.y - ft) + 'px) scale(' + k + ')';
    flight.style.opacity = '0';

    setTimeout(function () {
      flight.style.display = 'none';
      flight.classList.remove('flying');
      flight.style.transform = 'none';
      c.el.style.opacity = '1';
      if (!live) orb.classList.remove('live');
      UI.busy = false;
      maybeFollow(c);
    }, 400);
  }

  // ---------- sidebar wiring ----------
  document.getElementById('collapse').addEventListener('click', toggleRail);
  document.getElementById('mark').addEventListener('click', function () {
    if (document.body.classList.contains('rail')) toggleRail();
  });
  function toggleRail() {
    document.body.classList.toggle('rail');
    var t0 = performance.now();
    (function step(t) {
      syncRect(); draw();
      if (t - t0 < 300) requestAnimationFrame(step);
    })(t0);
  }
  document.getElementById('nNew').addEventListener('click', function () {
    switchTo(newBoard('Untitled'));
  });
  ['nSearch', 'nImages', 'nLibrary', 'settings'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function () {
      this.classList.add('on');
      var self = this;
      setTimeout(function () { self.classList.remove('on'); }, 140);
    });
  });

  // ---------- share + board menu ----------
  var menu = document.getElementById('menu');
  function flash(el) {
    el.classList.add('on');
    setTimeout(function () { el.classList.remove('on'); }, 140);
  }
  document.getElementById('dots3').addEventListener('click', function (e) {
    e.stopPropagation();
    document.getElementById('miPin').lastChild.textContent = B.pinned ? ' Unpin chat' : ' Pin chat';
    menu.classList.toggle('open');
  });
  window.addEventListener('pointerdown', function (e) {
    if (!menu.contains(e.target) && e.target.id !== 'dots3') menu.classList.remove('open');
  });
  document.getElementById('shareBtn').addEventListener('click', function () { flash(this); });
  document.getElementById('miPin').addEventListener('click', function () {
    B.pinned = !B.pinned; renderRecents(); menu.classList.remove('open');
  });
  ['miFiles', 'miArchive', 'miDelete'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function () {
      menu.classList.remove('open');
    });
  });

  // ---------- board chrome ----------
  document.getElementById('mNode').addEventListener('click', function () {
    UI.mode = 'node'; this.classList.add('on');
    document.body.classList.remove('linear');
    document.getElementById('mLinear').classList.remove('on'); draw();
  });
  document.getElementById('mLinear').addEventListener('click', function () {
    UI.mode = 'linear'; this.classList.add('on');
    document.body.classList.add('linear');
    document.getElementById('mNode').classList.remove('on');
    draw(); scrollToBottom();      // you open a chat at the newest message
  });
  document.getElementById('tThread').addEventListener('click', function () {
    UI.thread = !UI.thread; this.classList.toggle('on', UI.thread); draw();
  });
  document.getElementById('tHome').addEventListener('click', function () {
    var c = byId(B.lastId); if (!c) return;
    var p = renderPos(c);
    B.view.x = SR.w / 2 - (p.x + c.w / 2) * B.view.z;
    B.view.y = SR.h / 2 - (p.y + c.h / 2) * B.view.z;
    draw();
  });
  window.addEventListener('resize', function () { syncRect(); draw(); });

  // ---------- THE SEAM ----------
  // ================= voice =================
  // Both modes talk to the local relay (relay.js) so the OpenAI key stays off
  // this page. If the relay isn't running, voice is disabled and typing still
  // works. The board doesn't know or care that input came from speech — Mode 1
  // fills the composer, Mode 2 drives the same ask()/land() path as typing.
  // When served from the relay (http://localhost:PORT) use same-origin calls.
  // When opened straight from file:// the origin is 'null', so fall back to the
  // known relay address.
  var RELAY = (location.origin && location.origin.indexOf('http') === 0) ? location.origin : 'http://localhost:8787';
  var REALTIME_URL = 'https://api.openai.com/v1/realtime?model=gpt-4o-realtime-preview';

  // status line above the composer. real messages, real errors.
  var vstatus = document.getElementById('vstatus');
  function setStatus(text, kind) {
    // kind: '', 'connecting', 'listening', 'thinking', 'speaking', 'err'
    vstatus.className = 'show' + (kind ? ' ' + kind : '');
    var withDot = kind && kind !== 'err' && kind !== '';
    vstatus.innerHTML = (withDot ? '<span class="dot"></span>' : '') + escapeHtml(text);
  }
  function clearStatus() { vstatus.className = ''; vstatus.textContent = ''; }
  function flashStatus(text, kind, ms) {
    setStatus(text, kind || '');
    setTimeout(function () { if (!live) clearStatus(); }, ms || 3200);
  }
  function escapeHtml(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  function pickMime() {
    var opts = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
    for (var i = 0; i < opts.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i])) return opts[i];
    return '';
  }

  // ======== Mode 1: dictation (ChatGPT-style) ========
  // tap to start, tap to stop, transcribe into composer, edit before send,
  // no model response until you press Enter. clear states throughout.
  var dictate = document.getElementById('dictate');
  var dictRec = null, dictChunks = [], dictStream = null;

  dictate.addEventListener('click', function () {
    if (dictRec && dictRec.state === 'recording') stopDictation();
    else startDictation();
  });

  async function startDictation() {
    if (dictRec) return;
    setStatus('Requesting microphone…', 'connecting');
    try {
      dictStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      dictStream = null;
      flashStatus('Microphone blocked: ' + (err && err.message ? err.message : err) + '. Allow mic access and retry.', 'err', 5000);
      return;
    }
    try {
      dictChunks = [];
      dictRec = new MediaRecorder(dictStream, pickMime() ? { mimeType: pickMime() } : undefined);
      dictRec.ondataavailable = function (e) { if (e.data && e.data.size) dictChunks.push(e.data); };
      dictRec.onerror = function (e) {
        flashStatus('Recording error: ' + (e.error && e.error.message ? e.error.message : 'unknown'), 'err', 5000);
        cleanupDict();
      };
      dictRec.onstop = onDictStop;
      dictRec.start();
      dictate.classList.add('rec');
      setStatus('Recording — tap the mic to stop', 'listening');
    } catch (err) {
      flashStatus('Could not start recording: ' + (err && err.message ? err.message : err), 'err', 5000);
      cleanupDict();
    }
  }

  function stopDictation() {
    if (dictRec && dictRec.state !== 'inactive') {
      dictate.classList.remove('rec');
      dictate.classList.add('busy');
      setStatus('Processing…', 'thinking');
      dictRec.stop();
    }
  }

  async function onDictStop() {
    var mime = (dictRec && dictRec.mimeType) || 'audio/webm';
    if (dictStream) { dictStream.getTracks().forEach(function (t) { t.stop(); }); dictStream = null; }
    var blob = new Blob(dictChunks, { type: mime });
    dictRec = null;
    if (!blob.size) { dictate.classList.remove('busy'); flashStatus('Nothing recorded — try again.', 'err', 3000); return; }
    try {
      var r = await fetch(RELAY + '/transcribe', { method: 'POST', headers: { 'Content-Type': mime }, body: blob });
      if (!r.ok) {
        var detail = await r.text().catch(function () { return ''; });
        throw new Error('HTTP ' + r.status + (detail ? ' — ' + detail.slice(0, 160) : ''));
      }
      var text = (await r.text()).trim();
      dictate.classList.remove('busy');
      if (text) {
        input.value = (input.value ? input.value.trim() + ' ' : '') + text;
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        flashStatus('Transcribed — edit, then press Enter to send', '', 2600);
      } else {
        flashStatus('No speech detected.', 'err', 2600);
      }
    } catch (err) {
      dictate.classList.remove('busy');
      var m = String(err && err.message ? err.message : err);
      var hint = /Failed to fetch|NetworkError/.test(m) ? ' — is relay.js running on ' + RELAY + '?' : '';
      flashStatus('Transcription failed: ' + m + hint, 'err', 6000);
    }
  }
  function cleanupDict() {
    dictate.classList.remove('rec', 'busy');
    if (dictStream) { dictStream.getTracks().forEach(function (t) { t.stop(); }); dictStream = null; }
    dictRec = null;
  }

  // ======== Mode 2: continuous live conversation (ChatGPT Voice-style) ========
  // tap the orb to connect. server-side VAD means you just talk — no tap per
  // turn. the AI speaks back. you can interrupt. each completed exchange lands
  // as one card. orb + status show connecting/listening/thinking/speaking/ended.
  var live = null;                 // { pc, dc, stream, audioEl } while open
  var liveQ = '', liveA = '';      // transcripts building for the current turn
  var orbState = '';

  function setOrb(state) {         // '', connecting, listening, thinking, speaking, err
    orbState = state;
    orb.className = state ? state : '';
    orb.classList.toggle('live', !!live);
  }

  orb.addEventListener('click', function () { if (live) stopLive('Ended.'); else startLive(); });

  async function startLive() {
    setOrb('connecting');
    setStatus('Connecting…', 'connecting');
    var stream, pc, token;
    // 1) ephemeral token from relay
    try {
      var sres = await fetch(RELAY + '/session', { method: 'POST' });
      if (!sres.ok) {
        var d = await sres.text().catch(function () { return ''; });
        throw new Error('session HTTP ' + sres.status + (d ? ' — ' + d.slice(0, 160) : ''));
      }
      var sess = await sres.json();
      token = sess && sess.client_secret && sess.client_secret.value;
      if (!token) throw new Error('relay returned no token (check OPENAI_API_KEY)');
    } catch (err) {
      failLive('Could not start session: ' + msg(err) + (isNet(err) ? ' — is relay.js running on ' + RELAY + '?' : ''));
      return;
    }
    // 2) mic
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      failLive('Microphone blocked: ' + msg(err) + '. Allow mic access and retry.');
      return;
    }
    // 3) webrtc to OpenAI
    try {
      pc = new RTCPeerConnection();
      var audioEl = document.createElement('audio');
      audioEl.autoplay = true;
      pc.ontrack = function (e) { audioEl.srcObject = e.streams[0]; };
      pc.onconnectionstatechange = function () {
        if (!live) return;
        if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')
          failLive('Connection ' + pc.connectionState + '.');
      };
      stream.getTracks().forEach(function (t) { pc.addTrack(t, stream); });

      var dc = pc.createDataChannel('oai-events');
      dc.onopen = function () { live = { pc: pc, dc: dc, stream: stream, audioEl: audioEl }; setOrb('listening'); setStatus('Listening — just speak', 'listening'); };
      dc.onmessage = onLiveEvent;

      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      var ans = await fetch(REALTIME_URL, {
        method: 'POST', body: offer.sdp,
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/sdp' }
      });
      if (!ans.ok) {
        var da = await ans.text().catch(function () { return ''; });
        throw new Error('realtime HTTP ' + ans.status + (da ? ' — ' + da.slice(0, 160) : ''));
      }
      var answer = await ans.text();
      await pc.setRemoteDescription({ type: 'answer', sdp: answer });
      liveQ = ''; liveA = '';
      // live is set on dc.onopen
      // safety: clean up the pieces if we never opened
      setTimeout(function () {
        if (!live) { try { stream.getTracks().forEach(function (t) { t.stop(); }); pc.close(); } catch (e) {} }
      }, 8000);
    } catch (err) {
      try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      try { pc && pc.close(); } catch (e) {}
      failLive('Voice connection failed: ' + msg(err));
    }
  }

  function stopLive(note) {
    if (!live) { setOrb(''); clearStatus(); return; }
    try { live.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { live.dc.close(); live.pc.close(); } catch (e) {}
    live = null; setOrb('');
    if (note) flashStatus(note, '', 1800); else clearStatus();
  }
  function failLive(text) {
    if (live) { try { live.stream.getTracks().forEach(function (t) { t.stop(); }); live.pc.close(); } catch (e) {} live = null; }
    setOrb('err');
    setStatus(text, 'err');
    setTimeout(function () { if (!live) { orb.className = ''; clearStatus(); } }, 6000);
  }

  function onLiveEvent(ev) {
    var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    switch (m.type) {
      case 'input_audio_buffer.speech_started':
        // you started talking. if the AI was speaking, that's an interruption:
        // cut its audio and commit whatever it managed to say.
        if (orbState === 'speaking') {
          try { live.audioEl.pause(); } catch (e) {}
          commitTurnIfAny(true);      // interrupted answers still land — verbatim
          if (live && live.dc.readyState === 'open')
            live.dc.send(JSON.stringify({ type: 'response.cancel' }));
        }
        setOrb('listening'); setStatus('Listening…', 'listening');
        break;
      case 'input_audio_buffer.speech_stopped':
        setOrb('thinking'); setStatus('Thinking…', 'thinking');
        break;
      case 'conversation.item.input_audio_transcription.completed':
        liveQ = (m.transcript || '').trim();
        break;
      case 'response.audio_transcript.delta':
        if (orbState !== 'speaking') { setOrb('speaking'); setStatus('Speaking…', 'speaking'); }
        liveA += m.delta || '';
        break;
      case 'response.done':
        commitTurnIfAny();
        if (live) { setOrb('listening'); setStatus('Listening — just speak', 'listening'); }
        break;
      case 'error':
        failLive('Realtime error: ' + (m.error && m.error.message ? m.error.message : 'unknown'));
        break;
    }
  }

  function commitTurnIfAny(interrupted) {
    var q = liveQ, a = liveA.trim();
    liveQ = ''; liveA = '';
    if (q || a) commitVoiceTurn(q, a, !!interrupted);
  }

  function msg(e) { return e && e.message ? e.message : String(e); }
  function isNet(e) { return /Failed to fetch|NetworkError/.test(msg(e)); }

  // the seam: a completed spoken exchange becomes a card, exactly like typing.
  function commitVoiceTurn(question, answer, interrupted) {
    if (B.cards.length === 0 && question) {
      B.name = question.length > 38 ? question.slice(0, 38).trim() + '…' : question;
      renderRecents();
    }
    // place directly — no #flight hijack, since voice has no in-flight card here
    var probe = sizeOf(question, answer);
    var p = place(probe.w, probe.h);
    var c = addCard(question, answer, p.x, p.y, { interrupted: !!interrupted });
    B.lastId = c.id;
    draw();
    if (UI.mode === 'linear') scrollToBottom();
    else maybeFollow(c);
  }

  // ================= model stub (typed input) =================
  var CANNED = [
    "There are two clocks running on this surface and they don't agree, which is the whole point.\n\nThe number is the first clock. It's monotonic, it's flat, it never renumbers, and it gaps when you delete. It answers exactly one question — when did this happen — and it answers it the same way forever. That's why it can be quiet. A fact that never changes doesn't need to be loud about itself.\n\nPosition is the second clock, except it isn't a clock at all. It's a claim. Card 4 sitting immediately under card 19 says the two belong together, and nothing in the transcript says that. The transcript says they're fifteen exchanges apart, which is true and useless. You put them together because you saw something, and the only record that you saw it is the fact that they're touching.\n\nSo the interesting content isn't in either coordinate system. It's in the disagreement between them. Time says far, space says near — that gap is where your thinking actually lives, and it exists nowhere in the text. Flatten the board back into a scroll and it's gone without a trace. Not compressed. Gone.",
    "Yes.",
    "That's the part I'd push on. If placement is free but the model never reads it, position is decoration — and a canvas whose position means nothing is a lie the interface tells you. You'd be arranging meaning into a surface that isn't listening.",
    "The disfluency question is load-bearing and I don't think you get to defer it much longer.\n\nHere's the mechanism. Whisper and most production transcription models are trained on cleaned targets. Not as a post-process — the cleaning is baked into what they consider correct output. The model has learned that the right transcription of four seconds of \"I mean, the thing is, uh, the thing is\" is \"The thing is.\" It isn't editing you. It genuinely believes that's what you said, because that's what it was rewarded for producing.\n\nWhich means verbatim isn't a flag you set. It's a property of the model, and most of the good ones don't have it. You'd be choosing between a transcript that's accurate to your words and one that's accurate to your sentences, and those aren't the same artifact.\n\nWorth being honest about what you lose either way. The ums aren't noise — the pause before a word is where the reaching happened, and reaching is information. But a board full of \"uh\" is also a board you don't want to reread, and a record nobody rereads isn't serving anyone.\n\nI don't think there's a clean answer here. There's a decision, and it's yours, and it probably comes down to whether the board is a record of what you said or a record of how you thought.",
    "Right — the number carries time, the position carries meaning. Two coordinate systems doing different jobs on one surface, and the interesting content is where they disagree.",
    "Watch what the constraint actually buys you.\n\nThe engine knows two things. Next to the last one. Not on top of anything. That's the entire ruleset, and neither rule requires reading a single word of your content.\n\nCompare that to what any reasonable person would build instead. Cluster by topic. Auto-group related threads. Suggest a tidier arrangement. Every one of those needs the machine to form an opinion about what you meant — and the moment it has an opinion, your placement stops being an assertion and starts being a suggestion the system is free to overrule. You'd drag a card somewhere deliberate and come back to find it helpfully rehomed next to things it resembles. The board would be telling you what it thinks instead of holding what you think.\n\nSo the stupidity is the feature. A dumb engine can't disagree with you. It has no model of your meaning, so it can't be wrong about your meaning, so every arrangement on the board is yours by construction.\n\nThe cost is real and you should say it out loud: the board will never help you notice a connection you didn't already see. It has no idea what's on it. That's the trade. You get a surface that never lies about authorship, and you give up a surface that could have been clever.",
    "I think so.",
    "A card that's far in time but near in space is something you put there on purpose. Nothing in the conversation put them together — you did, with your hands, because you saw a connection the transcript doesn't contain. That's the highest-signal event on the board, and a linear chat can physically never capture it.",
    "Not sure yet. Say more?",
    "Linear is the honest test, and it's a harder constraint than it sounds.\n\nIf linear is a lens, it can't own anything. It reads the board and draws it as a scroll. It doesn't write x, it doesn't write y, it doesn't reorder, it doesn't get its own copy of anything. Toggle to linear, toggle back, and every card is exactly where you left it — not restored, not recomputed, just never touched. The moment linear starts writing positions it isn't a view anymore, it's a second source of truth, and now you've got two systems that can disagree about where a card lives.\n\nThe other half is behavioural, and it's the part people skip. In linear it has to be a chat. Not a board pretending to be a chat. It scrolls, it doesn't zoom, the wheel does what the wheel does in every other chat you've ever used, and new answers stream inline at the bottom instead of flying in from somewhere. Nothing floats. Nothing occludes. No card chrome, no minimize button, no grip in the corner. Those are board affordances and they have no meaning in a scroll.\n\nGet that right and linear costs you nothing to keep. It's a projection. Get it wrong and it's a mode, and modes are where prototypes go to die.",
    "Then the placement engine is closed: the camera moves, cards never do. N+1 lands right of N. Occupied space goes to nearest free, never overlapping, never pushing. None of it requires the machine to have an opinion about what you said.",
    "The anchoring question and the context question are the same question wearing two hats, and that's why neither one resolves on its own.\n\nSay you click card 7 and start talking. Something has to happen to \"right of N\" — the engine's one rule now points somewhere other than the end of the board, so card 8's successor lands next to 7 instead. Fine. That part's mechanical.\n\nThe part that isn't mechanical: what does the model get? If it gets the whole board, the anchor was purely cosmetic — you moved a card and changed nothing about the conversation. If it gets 1 through 7 and stops, you've built branching, and now the board has a topology with forks in it whether you wanted one or not. If it gets 7 alone, every anchored card is a cold start and continuity dies.\n\nAnd there's a nastier version. Once anchoring is a thing you can do, the model's context becomes a function of where cards are — which means position feeds back into content. Right now the board is downstream of the conversation. That change makes the conversation downstream of the board, and I don't think you can undo it once cards start existing that were generated under it.\n\nYou said don't decide this. I'm not deciding it. I'm saying the two halves are one decision, and picking an anchor gesture first will quietly pick the context rule for you."

  var ci = 0;
  // the canned stand-in. still used when the relay/model can't answer.
  function stubRespond(q, onToken, onDone) {
    var full = CANNED[ci++ % CANNED.length];
    var words = full.split(' '), i = 0, sofar = '';
    var tick = setInterval(function () {
      sofar += (i ? ' ' : '') + words[i++];
      onToken(sofar);
      if (i >= words.length) { clearInterval(tick); setTimeout(function () { onDone(full); }, 300); }
    }, 46);
  }

  // RESPOND is the seam. It receives the context package (entry.pkg), sends it
  // to the relay's /chat, and streams the answer back. If the model can't
  // answer, the real reason is shown and the stub answers so the board keeps going.
  function RESPOND(q, onToken, onDone, entry) {
    if (!entry || typeof fetch !== 'function') {
      if (entry) entry.answeredBy = 'stub';
      return stubRespond(q, onToken, onDone);
    }
    var got = '', finished = false;
    function finish(text) { if (finished) return; finished = true; onDone(text); ctxRefresh(); }

    fetch(RELAY + '/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ package: ctxStrip(entry.pkg) })      // debug block is not sent
    }).then(function (res) {
      if (!res.ok) return res.text().then(function (t) {
        throw new Error('HTTP ' + res.status + (t ? ' — ' + t.slice(0, 240) : ''));
      });
      var reader = res.body.getReader(), dec = new TextDecoder();
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          got += dec.decode(r.value, { stream: true });
          onToken(got);
          return pump();
        });
      })();
    }).then(function () {
      if (!got.trim()) throw new Error('the model returned an empty answer');
      entry.answeredBy = 'model';
      finish(got);
    }).catch(function (err) {
      if (finished) { console.error(err); return; }               // failure after we already landed
      entry.error = msg(err);
      if (got.trim()) { entry.answeredBy = 'model (partial)'; finish(got); return; }
      entry.answeredBy = 'stub';
      flashStatus('Model call failed: ' + msg(err) + (isNet(err) ? ' — is relay.js running on ' + RELAY + '?' : '') +
                  ' — canned stub used instead.', 'err', 7000);
      ctxRefresh();
      stubRespond(q, onToken, onDone);
    });
  }

  // dev hook for the console: SKC.log[0].pkg, SKC.build('q', card, quote), SKC.panel()
  window.SKC = { board: function () { return B; }, build: buildContextPackage, strip: ctxStrip,
                 log: CTX_LOG, panel: toggleCtx };

  // ---------- start ----------
  syncRect();
  var seed = newBoard('Untitled');
  newBoard('Recruiter call preparation').pinned = true;
  newBoard('Placement rules, camera behaviour');
  newBoard('Does position mean anything');
  switchTo(seed);
  draw();
  input.focus();
})();
